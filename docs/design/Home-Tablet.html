.g-round{width:50px;height:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#00706a,#004541);color:#ffffff;border:1px solid rgba(126,232,199,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 18px rgba(126,232,199,.4)}

.chip-off{background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.5));color:#005c58;border:1px solid rgba(0,92,88,.18);box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(0,92,88,.08)}
.chip-on{background:linear-gradient(180deg,#00706a,#004541);color:#ffffff;border:1px solid rgba(126,232,199,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 16px rgba(126,232,199,.45)}
.neon-t{color:#7ee8c7;text-shadow:0 0 10px rgba(126,232,199,.55),0 0 30px rgba(126,232,199,.35)}
img[src="assets/7e9c2bf666d78520c5029e5857437282.svg"]{filter:drop-shadow(0 0 4px rgba(126,232,199,.8)) drop-shadow(0 0 14px rgba(126,232,199,.35))}

.ring{display:flex;align-items:center;justify-content:center;border-radius:999px;border:1.5px solid rgba(126,232,199,.8);color:#7ee8c7;box-shadow:0 0 16px rgba(126,232,199,.35),inset 0 0 12px rgba(126,232,199,.15)}
.tile{display:flex;align-items:center;justify-content:center;border-radius:22px;color:#005c58;background:linear-gradient(135deg,rgba(220,250,240,.9),rgba(184,242,222,.45));border:1px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,92,88,.14),inset 0 1px 0 #fff,0 10px 24px rgba(0,92,88,.16)}
.scene{-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 16%,#000 82%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,#000 16%,#000 82%,transparent 100%)}
/* smooth motion */
:root{--ease:cubic-bezier(.22,1,.36,1)}
html{scroll-behavior:smooth}
.g-btn,.chip,.g-arrow,.g-round{transition:background .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease),transform .5s var(--ease),color .35s var(--ease),opacity .35s var(--ease) !important}
.g-btn:hover{transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
main > section{animation:fadeUp .9s var(--ease) both}
main > section:nth-of-type(2){animation-delay:.08s}main > section:nth-of-type(n+3){animation-delay:.16s}
@supports (animation-timeline: view()){main > section:not(:first-of-type){animation:fadeUp linear both;animation-timeline:view();animation-range:entry 0% cover 20%;animation-delay:0s}}
.scene{animation:floaty 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}html{scroll-behavior:auto}}
</style>

        { t: 'تصاميم مخصصة', s: 'للمناسبات والطلبات الخاصة.', d: D.pen },
        { t: 'دعم مستمر', s: 'فريق دائم لمساعدتك في كل خطوة.', d: D.headset }
      ],
      steps: [
        { n: '1', t: 'اختر المنتج', s: 'حدد النوع والمواصفات.', d: D.shirt },
        { n: '2', t: 'أرسل تصميمك', s: 'ارفع تصميمك أو اطلب مساعدة.', d: D.image },
        { n: '3', t: 'نقوم بالطباعة', s: 'بعد مراجعة طلبك.', d: D.gear },
        { n: '4', t: 'استلم طلبك', s: 'من المحل أو بالتوصيل.', d: D.truck }
      ],
      chips: chips, gal: gal, dots: dots,
      galPrev: function () { if (n) self.setState({ gal: (self.state.gal - 1 + n) % n }); },
      galNext: function () { if (n) self.setState({ gal: (self.state.gal + 1) % n }); },
      rev: reviews[r],
      revDots: reviews.map(function (x, k) { return { label: 'رأي ' + (k + 1), cur: k === r ? 'true' : 'false', style: dot(k === r), go: function () { self.setState({ rev: k }); } }; }),
      revPrev: function () { self.setState({ rev: (self.state.rev - 1 + reviews.length) % reviews.length }); },
      revNext: function () { self.setState({ rev: (self.state.rev + 1) % reviews.length }); }
    };
  }
}
</script>
