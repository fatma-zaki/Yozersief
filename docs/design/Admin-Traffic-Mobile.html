<line x1="0" x2="800" y1="86" y2="86" stroke="rgba(0,92,88,0.1)" vector-effect="non-scaling-stroke"></line>

<div style="position: absolute; inset: 0 0 26px 0; display: flex">

<section class="gl-light anim-up d3" aria-labelledby="ms-h" style="border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 12px">

<span style="display: flex; justify-content: space-between; font-size: 13px"><span style="display: flex; align-items: center; gap: 6px; font-weight: 700"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: #005c58"><path d="{{x.icon}}"></path></svg>{{x.name}}</span><span><strong>{{x.n}}</strong> <span class="muted">· {{x.pct}}</span></span></span>
<span aria-hidden="true" style="height: 8px; border-radius: 999px; background: rgba(0,92,88,0.08); overflow: hidden"><span class="bar" style="{{x.bar}}"></span></span>

<section class="gl-light anim-up d3" aria-labelledby="mf-h" style="border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 10px">

</sc-for>
</ol>
</section>

<section class="gl-light anim-up d3" aria-labelledby="md-h" style="border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 12px">

<strong style="font-size: 16px">{{v.pct}}</strong><span class="muted" style="font-size: 11px; font-weight: 700">{{v.name}}</span>

</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: linear-gradient(135deg,rgba(184,242,222,.45),rgba(126,232,199,.16))">

<span style="flex-grow: 1; display: flex; flex-direction: column"><strong style="font-size: 13px">{{topPage}}</strong><span class="muted" style="font-size: 11px">أكتر صفحة اتشافت بعد الرئيسية</span></span>
<strong style="font-size: 13px">{{topPageN}}</strong>
</div>
</section>
</main>
