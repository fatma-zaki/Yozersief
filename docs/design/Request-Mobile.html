</x-dc></template>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { qty: 12, sizes: { S: 2, M: 4, L: 3, XL: 0, XXL: 0 }, places: ['front'], sheet: false }; }
  renderVals() {
    var s = this.state, self = this;
    var OK = 'M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3';
    var WARN = 'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01';
    var DOT = 'M12 12m-3 0a3 3 0 1 0 6 0 3 3 0 1 0-6 0';
    var BOX = 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z';
    var BOXON = 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 12l3 3 5-6';
    var sum = 0; Object.keys(s.sizes).forEach(function (k) { sum += s.sizes[k]; });
    var sumOk = s.qty > 0 && sum === s.qty;
    var keys = Object.keys(s.sizes);
    var sizes = keys.map(function (k, i) {
      return { k: k, v: s.sizes[k], dl: 'قلّل ' + k, ul: 'زوّد ' + k,
        rowStyle: 'display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; min-height: 56px; ' + (i < keys.length - 1 ? 'border-bottom: 1px solid rgba(0,92,88,0.1)' : ''),
        down: function () { var z = Object.assign({}, self.state.sizes); z[k] = Math.max(0, z[k] - 1); self.setState({ sizes: z }); },
        up: function () { var z = Object.assign({}, self.state.sizes); z[k] = z[k] + 1; self.setState({ sizes: z }); } };
    });
    var places = [['front', 'أمام'], ['back', 'ظهر'], ['sleeve', 'كُم']].map(function (p) {
      var on = s.places.indexOf(p[0]) >= 0;
      return { label: p[1], on: on, icon: on ? BOXON : BOX, cls: 'chip g-btn ' + (on ? 'chip-on' : 'chip-off'),
        toggle: function () { var a = self.state.places.slice(); var i = a.indexOf(p[0]); if (i >= 0) a.splice(i, 1); else a.push(p[0]); self.setState({ places: a }); } };
    });
    var sumText = sumOk ? 'مجموع المقاسات ' + sum + ' مطابق للكمية.' : (sum < s.qty ? 'المجموع ' + sum + ' من ' + s.qty + ': ناقص ' + (s.qty - sum) + ' قطعة.' : 'المجموع ' + sum + ' أكتر من الكمية بـ ' + (sum - s.qty) + '.');
    var raw = [
      ['المنتج', true, 'تيشيرت · أبيض'],
      ['الكمية', s.qty > 0, s.qty > 0 ? s.qty + ' قطعة' : 'حدد الكمية'],
      ['توزيع المقاسات', sumOk, sumText],
      ['مكان الطباعة', s.places.length > 0, s.places.length ? 'تم الاختيار' : 'اختار مكان واحد على الأقل'],
      ['التصميم', false, 'الخطوة الجاية: ارفع تصميمك أو اطلب مساعدة'],
      ['بياناتك والاستلام', false, 'في الخطوة 4']
    ];
    var done = raw.filter(function (r) { return r[1]; }).length;
    var issues = raw.filter(function (r, i) { return !r[1] && i < 4; });
    var wrap = 'width: 34px; height: 34px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; ';
    return {
      qty: s.qty, sizes: sizes, places: places, sumText: sumText,
      sumIcon: sumOk ? OK : WARN, sumIconTop: issues.length ? WARN : OK,
      topIconWrap: wrap + 'border-radius: 999px; ' + (issues.length ? 'background: rgba(214,174,98,0.2); color: #f0d39a; border: 1px solid #d6ae62' : 'background: linear-gradient(180deg,#b8f2de,#7ee8c7); color: #01302d'),
      sumStyle: 'margin: 10px 0 0; display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 22px; font-weight: 700; ' + (sumOk ? 'background: linear-gradient(135deg,rgba(184,242,222,.7),rgba(126,232,199,.3)); color: #005c58; box-shadow: 0 0 0 1px rgba(0,92,88,0.18), 0 0 14px rgba(126,232,199,0.3)' : 'background: #fbf6ec; color: #5c430f; box-shadow: inset 0 0 0 1px rgba(184,134,43,0.6)'),
      done: done, total: raw.length, shortMsg: issues.length ? 'محتاج انتباه: ' + issues[0][0] : 'الخطوة دي كاملة',
      bar: 'height: 100%; border-radius: 999px; background: linear-gradient(90deg,#7ee8c7,#b8f2de); box-shadow: 0 0 10px rgba(126,232,199,0.8); width: ' + Math.round(done / raw.length * 100) + '%',
      checks: raw.map(function (r, i) {
        var bad = !r[1] && i < 4;
        return { label: r[0], msg: r[2], bad: bad, icon: r[1] ? OK : (bad ? WARN : DOT),
          wrap: wrap + (r[1] ? 'background: linear-gradient(180deg,#b8f2de,#7ee8c7); color: #01302d; box-shadow: 0 0 12px rgba(126,232,199,0.5)' : (bad ? 'background: rgba(214,174,98,0.18); color: #f0d39a; border: 1px solid #d6ae62' : 'background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.2)')) };
      }),
      qtyDown: function () { self.setState({ qty: Math.max(0, self.state.qty - 1) }); },
      qtyUp: function () { self.setState({ qty: self.state.qty + 1 }); },
      sheet: s.sheet, openSheet: function () { self.setState({ sheet: true }); }, closeSheet: function () { self.setState({ sheet: false }); },
      next: function () { if (issues.length) self.setState({ sheet: true }); }
    };
  }
}
</script>
