<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تتبّع الطلب — الشركة: اعتمد الموكاب (داكن)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="assets/dc-lite.js"></script>
</head>
<body>
<template id="dc-template"><x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#001412}
*{box-sizing:border-box}
a{color:#7ee8c7}
button,input{font-family:inherit}
:focus-visible{outline:2px solid #7ee8c7;outline-offset:2px}
.glass-nav{background:linear-gradient(160deg,rgba(5,64,57,.62),rgba(0,27,23,.64));-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(126,232,199,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 18px rgba(126,232,199,.1),0 12px 30px rgba(0,0,0,.45)}
.gl{background:linear-gradient(160deg,rgba(5,64,57,.5) 0%,rgba(0,27,23,.55) 100%);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(126,232,199,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 34px rgba(0,0,0,.35)}
.pill{display:inline-flex;align-items:center;padding:3px 14px;border-radius:999px;background:rgba(126,232,199,.08);border:1px solid rgba(126,232,199,.4);color:#b8f2de;font-size:12px;line-height:20px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 12px rgba(126,232,199,.18)}
.g-btn{position:relative;cursor:pointer;-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);transition:box-shadow .2s,transform .15s}
.g-btn:active{transform:scale(.98)}
.g-btn[disabled]{opacity:.65;cursor:progress}
.g-cta{background:linear-gradient(180deg,rgba(5,64,57,.75) 0%,rgba(0,27,23,.75) 100%);color:#ffffff;border:1.5px solid rgba(126,232,199,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 18px rgba(126,232,199,.12),0 0 18px rgba(126,232,199,.4),0 0 40px rgba(126,232,199,.16)}
.g-soft{background:rgba(126,232,199,.07);color:#b8f2de;border:1px solid rgba(126,232,199,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.g-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.chip{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
.chip-off{background:rgba(126,232,199,.05);color:rgba(242,251,248,.6);border:1px solid rgba(126,232,199,.2)}
.chip-on{background:linear-gradient(180deg,rgba(126,232,199,.28),rgba(126,232,199,.12));color:#ffffff;border:1px solid rgba(126,232,199,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 16px rgba(126,232,199,.35)}
.neon-t{color:#7ee8c7;text-shadow:0 0 10px rgba(126,232,199,.5),0 0 26px rgba(126,232,199,.28)}
img[src="assets/7e9c2bf666d78520c5029e5857437282.svg"]{filter:drop-shadow(0 0 4px rgba(126,232,199,.7)) drop-shadow(0 0 12px rgba(126,232,199,.3))}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.fld{width:100%;min-height:52px;padding:10px 16px;border-radius:16px;border:1px solid rgba(126,232,199,.3);background:rgba(0,20,18,.6);font-size:17px;color:#ffffff;transition:border-color .15s,box-shadow .15s}
.fld:focus{border-color:#7ee8c7;box-shadow:0 0 0 3px rgba(126,232,199,.3);outline:none}
.fld::placeholder{color:rgba(242,251,248,.4)}
.lbl{font-size:14px;font-weight:700;color:#f2fbf8}
.divider{height:1px;margin:0 24px;background:linear-gradient(90deg,rgba(126,232,199,0) 0%,rgba(126,232,199,.55) 50%,rgba(126,232,199,0) 100%);box-shadow:0 0 10px rgba(126,232,199,.35)}
</style>
</helmet>
<div style="width: 390px; min-height: 1800px; position: relative; background: #001412; color: #f2fbf8; font-family: Cairo, 'Segoe UI', Tahoma, sans-serif">

<header style="position: sticky; top: 10px; z-index: 50; padding: 0 12px; height: 0">
<div class="glass-nav" style="border-radius: 22px; padding: 6px 8px; display: flex; align-items: center; justify-content: space-between">
<a href="Home-Mobile-Dark.html" aria-label="يوزرسيف — الرئيسية"><img src="assets/a09b143d6b90eabfcff65a45080007f7.jpg" alt="شعار يوزرسيف" style="display: block; width: 52px; height: 52px; border-radius: 14px"></a>
<div style="display: flex; gap: 6px">
<a class="g-btn g-soft g-icon" href="Home-Mobile-Dark.html" aria-label="رجوع للرئيسية">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"></path></svg></a>
<sc-if value="{{verified}}" hint-placeholder-val="{{false}}">
<button class="g-btn g-soft" type="button" onClick="{{signOut}}" style="min-height: 44px; padding: 6px 14px; border-radius: 14px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>خروج</button>
</sc-if>
</div>
</div>
</header>

<main id="top">
<!-- Hero -->
<section aria-labelledby="trd-h" style="position: relative; overflow: hidden; isolation: isolate; background: #001412; padding: 92px 16px 44px">
<div aria-hidden="true" style="position: absolute; z-index: -1; inset: 0; background: radial-gradient(ellipse 90% 45% at 70% 20%, rgba(5,64,57,0.85) 0%, rgba(5,64,57,0) 100%), radial-gradient(ellipse 90% 40% at 25% 80%, rgba(3,39,34,0.9) 0%, rgba(3,39,34,0) 100%)"></div>
<img src="assets/7e9c2bf666d78520c5029e5857437282.svg" alt="" aria-hidden="true" style="position: absolute; z-index: -1; top: 30px; left: -220px; width: 400px; height: 400px; opacity: .5; pointer-events: none">
<img src="assets/7e9c2bf666d78520c5029e5857437282.svg" alt="" aria-hidden="true" style="position: absolute; z-index: -1; bottom: -150px; right: -220px; width: 380px; height: 380px; transform: rotate(180deg); opacity: .4; pointer-events: none">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px">
<span class="pill">تتبّع الطلب</span>
<h1 id="trd-h" style="margin: 0; font-size: 38px; line-height: 54px; font-weight: 800; color: #ffffff">تابع حالة <span class="neon-t" style="color: #7ee8c7">طلبك</span></h1>
<sc-if value="{{notVerified}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 15px; line-height: 26px; color: rgba(242,251,248,0.75)">{{introText}}</p>
</sc-if>
</div>

<sc-if value="{{verified}}" hint-placeholder-val="{{false}}">
<div class="gl" style="margin-top: 20px; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 16px; border-color: rgba(126,232,199,0.35); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 0 26px rgba(126,232,199,0.12), 0 16px 34px rgba(0,0,0,0.35)">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 13px; color: rgba(242,251,248,0.75)">طلب رقم <strong dir="ltr" class="neon-t" style="letter-spacing: 1px">{{orderId}}</strong></span>
<span style="padding: 1px 10px; border-radius: 999px; background: rgba(126,232,199,0.06); border: 1px solid rgba(126,232,199,0.25); font-size: 11px; font-weight: 700; color: rgba(242,251,248,0.75)">بيانات تجريبية</span>
</div>
<div role="group" aria-label="عرض تجريبي: نوع الطلب" style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
<span style="font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.65)">جرّب طلب:</span>
<sc-for list="{{types}}" as="t" hint-placeholder-count="2">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<sc-if value="{{isBiz}}" hint-placeholder-val="{{false}}">
<span class="fade" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: rgba(126,232,199,0.1); border: 1px solid rgba(126,232,199,0.4); color: #b8f2de; font-size: 13px; font-weight: 700"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18ZM6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"></path></svg>{{orgName}} · طلب كبير</span>
</sc-if>
<div style="display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="{{ringStyle}}"><svg class="ic" viewBox="0 0 24 24" style="width: 28px; height: 28px; stroke-width: 1.6"><path d="{{st.icon}}"></path></svg></span>
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; color: rgba(242,251,248,0.68)">الحالة الحالية · {{sentOn}}</span>
<h2 style="margin: 0; font-size: 24px; line-height: 36px; font-weight: 800; color: #ffffff">{{st.label}}</h2>
</div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 24px; color: rgba(242,251,248,0.78)">{{st.desc}}</p>
<ol aria-label="مراحل الطلب" style="{{railOl}}">
<span aria-hidden="true" style="position: absolute; top: 21px; right: 10%; left: 10%; height: 1px; background: linear-gradient(90deg, rgba(126,232,199,0.15), rgba(126,232,199,0.6), rgba(126,232,199,0.15)); box-shadow: 0 0 8px rgba(126,232,199,0.45)"></span>
<sc-for list="{{rail}}" as="r" hint-placeholder-count="5">
<li aria-current="{{r.cur}}" style="position: relative; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center">
<span aria-hidden="true" style="{{r.tile}}"><svg class="ic" viewBox="0 0 24 24" style="width: 20px; height: 20px; stroke-width: 2"><path d="{{r.icon}}"></path></svg></span>
<span style="{{r.text}}">{{r.label}}</span>
</li>
</sc-for>
</ol>
</div>
</sc-if>
</section>

<div class="divider" aria-hidden="true"></div>

<!-- Verify -->
<sc-if value="{{notVerified}}" hint-placeholder-val="{{true}}">
<section aria-label="التحقق من الطلب" style="position: relative; overflow: hidden; isolation: isolate; background: #001b17; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 16px">
<img src="assets/7e9c2bf666d78520c5029e5857437282.svg" alt="" aria-hidden="true" style="position: absolute; z-index: -1; top: 160px; right: -210px; width: 400px; height: 400px; opacity: .25; pointer-events: none">
<form class="gl" onSubmit="{{submit}}" style="border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
<div role="list" aria-label="خطوات التحقق" style="display: flex; gap: 8px">
<span role="listitem" class="{{chipA}}" aria-current="{{curA}}"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: rgba(126,232,199,0.16); font-size: 12px">1</span>بيانات الطلب</span>
<span role="listitem" class="{{chipB}}" aria-current="{{curB}}"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: rgba(126,232,199,0.16); font-size: 12px">2</span>كود التحقق</span>
</div>
<sc-if value="{{stageA}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{linkBad}}" hint-placeholder-val="{{false}}"><p role="status" style="{{badStyle}}">اللينك ده ناقص أو قديم. اكتب رقم الطلب من رسالة الواتساب بنفسك.</p></sc-if>
<sc-if value="{{hasLink}}" hint-placeholder-val="{{false}}">
<div class="pop" style="{{linkCard}}">
<span aria-hidden="true" style="{{linkIcWrap}}"><svg class="ic" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="{{linkSub}}">رقم الطلب · من لينك الواتساب</span><strong dir="ltr" style="{{linkRefStyle}}">{{ref}}</strong></span>
<button type="button" onClick="{{clearLink}}" style="{{linkBtn}}">مش طلبي؟</button>
</div>
</sc-if>
<sc-if value="{{noLink}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label class="lbl" for="td-ref">رقم الطلب</label>
<input class="fld" id="td-ref" type="text" dir="ltr" autocapitalize="characters" autocomplete="off" value="{{ref}}" onChange="{{onRef}}" placeholder="YZ-XXXXXX" style="letter-spacing: 1px">
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 6px">
<label class="lbl" for="td-phone">رقم الموبايل اللي طلبت بيه</label>
<input class="fld" id="td-phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" value="{{phone}}" onChange="{{onPhone}}" placeholder="01xxxxxxxxx">
</div>
</div>
</sc-if>
<sc-if value="{{stageB}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 14px; line-height: 22px; color: rgba(242,251,248,0.75)">بعتنالك كود من 6 أرقام على واتساب الرقم المنتهي بـ <strong dir="ltr" style="color: #ffffff">{{phoneTail}}</strong>.</p>
<label class="lbl" for="td-code">كود التحقق</label>
<input class="fld" id="td-code" type="text" inputmode="numeric" autocomplete="one-time-code" dir="ltr" maxlength="6" value="{{code}}" onChange="{{onCode}}" style="min-height: 58px; font-size: 26px; font-weight: 800; letter-spacing: 10px; text-align: center">
<button type="button" onClick="{{backA}}" style="align-self: flex-start; min-height: 44px; padding: 6px 0; border: 0; background: transparent; color: #7ee8c7; font-size: 14px; font-weight: 700; cursor: pointer">غيّر البيانات</button>
</div>
</sc-if>
<sc-if value="{{err}}" hint-placeholder-val="{{false}}">
<p role="alert" style="margin: 0; display: flex; gap: 8px; align-items: flex-start; padding: 10px 14px; border-radius: 16px; background: rgba(214,174,98,0.12); border: 1px solid rgba(214,174,98,0.6); font-size: 14px; line-height: 22px; font-weight: 700">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; color: #d6ae62"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"></path></svg>{{err}}</p>
</sc-if>
<button class="g-btn g-cta" type="submit" disabled="{{busy}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; border-radius: 999px; font-size: 16px; font-weight: 800">{{submitLabel}}
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M12 19l-7-7 7-7M19 12H5"></path></svg></button>
</form>

<div class="gl" style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border-style: dashed; border-color: rgba(126,232,199,0.35)">
<span class="pill" style="align-self: flex-start">وضع تجريبي</span>
<span style="font-size: 14px; line-height: 22px">طلب تجريبي: <strong dir="ltr">YZ-8K3QF7</strong> · موبايل <strong dir="ltr">01012345678</strong> · كود <strong dir="ltr">246810</strong></span>
<button class="g-btn g-soft" type="button" onClick="{{fillDemo}}" style="align-self: flex-start; min-height: 44px; padding: 6px 18px; border-radius: 999px; font-size: 14px; font-weight: 700">املا البيانات التجريبية</button>
</div>
<p style="margin: 0; text-align: center; font-size: 13px; line-height: 22px; color: rgba(242,251,248,0.68)">نسيت رقم الطلب؟ <a href="https://wa.me/201116891025" style="font-weight: 700">كلّمنا واتساب</a> من نفس رقم الموبايل.</p>
</section>
</sc-if>

<!-- Verified details -->
<sc-if value="{{verified}}" hint-placeholder-val="{{false}}">
<section aria-label="تفاصيل الطلب" style="position: relative; overflow: hidden; isolation: isolate; background: #001b17; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 16px">
<img src="assets/7e9c2bf666d78520c5029e5857437282.svg" alt="" aria-hidden="true" style="position: absolute; z-index: -1; top: 360px; left: -210px; width: 420px; height: 420px; opacity: .25; pointer-events: none">

<sc-if value="{{st.awaiting}}" hint-placeholder-val="{{true}}">
<section aria-labelledby="needd-h" class="gl" style="border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; border: 1.5px solid rgba(214,174,98,0.85); box-shadow: 0 0 0 4px rgba(214,174,98,0.1), 0 0 22px rgba(214,174,98,0.18)">
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(214,174,98,0.16); color: #d6ae62"><svg class="ic" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"></path></svg></span>
<h2 id="needd-h" style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 800; color: #ffffff">المطلوب منك</h2>
</div>
<p style="margin: 0; font-size: 15px; line-height: 26px; color: rgba(242,251,248,0.75)">ملف التصميم اللي رفعته دقته قليلة وهيطلع مش واضح على مقاس الظهر. ابعت نسخة بدقة أعلى (PNG أو PDF).</p>
<label class="g-btn g-cta" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border-radius: 999px; font-size: 15px; font-weight: 800">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>ارفع الملف الجديد
<input type="file" style="position: absolute; opacity: 0; width: 1px; height: 1px"></label>
</section>
</sc-if>
<sc-if value="{{st.rejected}}" hint-placeholder-val="{{false}}">
<section class="gl" style="border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px; border: 1.5px solid rgba(242,251,248,0.4)">
<h2 style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 800; color: #ffffff">سبب الرفض</h2>
<p style="margin: 0; font-size: 15px; line-height: 26px; color: rgba(242,251,248,0.75)">الكمية المطلوبة أقل من الحد الأدنى لطباعة الهوديز بالتطريز. [سبب تجريبي]</p>
<a class="g-btn g-cta" href="Request-Mobile-Dark.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 999px; text-decoration: none; font-size: 15px; font-weight: 800">ابدأ طلب معدّل</a>
</section>
</sc-if>
<sc-if value="{{st.approved}}" hint-placeholder-val="{{false}}">
<section class="gl" style="border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 800; color: #ffffff">تفاصيل الموافقة</h2>
<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px">
<dt style="font-weight: 700">السعر</dt><dd style="margin: 0; color: rgba(242,251,248,0.72)">[يحدده يوزرسيف]</dd>
<dt style="font-weight: 700">الموعد المتوقع</dt><dd style="margin: 0; color: rgba(242,251,248,0.72)">[يحدده يوزرسيف]</dd>
</dl>
<p style="margin: 0; font-size: 13px; line-height: 22px; color: rgba(242,251,248,0.65)">الموافقة مش معناها إن التنفيذ بدأ. هنبلغك أول ما نبدأ.</p>
</section>
</sc-if>

<sc-if value="{{bizAct}}" hint-placeholder-val="{{false}}">
<section aria-labelledby="act-h" class="gl pop" style="{{actBox}}">
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="{{actIcWrap}}"><svg class="ic" viewBox="0 0 24 24"><path d="{{act.icon}}"></path></svg></span>
<h2 id="act-h" style="{{h2Style}}">{{act.title}}</h2>
</div>
<p style="{{pStyle}}">{{act.body}}</p>
<sc-if value="{{act.quote}}" hint-placeholder-val="{{false}}">
<dl style="{{qBox}}">
<sc-for list="{{quoteRows}}" as="q" hint-placeholder-count="4"><dt style="font-weight: 700">{{q.k}}</dt><dd style="margin: 0">{{q.v}}</dd></sc-for>
