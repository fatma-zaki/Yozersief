.side-l:hover{background:rgba(126,232,199,.07);color:#ffffff}
.rowbtn{cursor:pointer;font-family:inherit;transition:background .15s}
.rowbtn:hover{background:rgba(126,232,199,.08) !important}
.stat{cursor:pointer;transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-2px)}
.h3{margin:0;font-size:13px;font-weight:700;color:rgba(242,251,248,.6)}
/* smooth motion */
:root{--ease:cubic-bezier(.22,1,.36,1)}
html{scroll-behavior:smooth}
.g-btn,.chip,.rowbtn,.side-l,.stat,.fld{transition:background .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease),transform .5s var(--ease),color .35s var(--ease),opacity .35s var(--ease) !important}
.g-btn:hover{transform:translateY(-1px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.anim-up{animation:fadeUp .8s var(--ease) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.pop{animation:pop .5s var(--ease) both}
.fade{animation:fadeIn .4s var(--ease) both}
.slide{animation:slideIn .6s var(--ease) both}

.check:focus-within{outline:2px solid #7ee8c7;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

      waText: waText, trackUrl: trackUrl, selName: selR ? selR.name : '', selPhone: selR ? selR.phone : '',
      copyLabel: s.copied ? 'اتنسخ ✓' : 'انسخ اللينك',
      copyLink: function () { try { if (navigator.clipboard) navigator.clipboard.writeText(trackUrl); } catch (err) {} self.setState({ copied: true }); },
      waCheckStyle: s.waOn ? 'background: linear-gradient(180deg,rgba(126,232,199,.2),rgba(126,232,199,.06)); box-shadow: 0 0 0 1px rgba(126,232,199,0.55)' : 'background: rgba(126,232,199,0.04); box-shadow: 0 0 0 1px rgba(126,232,199,0.2)',
      waBox: 'width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px; display: flex; align-items: center; justify-content: center; ' + (s.waOn ? 'background: linear-gradient(180deg,#b8f2de,#7ee8c7); color: #001412; box-shadow: 0 0 10px rgba(126,232,199,0.6)' : 'background: transparent; color: transparent; border: 1.5px solid rgba(126,232,199,0.45)'),
      dlgBtnCls: d ? d.cls : 'g-btn g-cta',
      closeDlg: function () { self.setState({ dlg: '' }); },
      confirm: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        if (!d || self.state.saving) return;
        var txt = self.state.dlgText.trim();
        if (d.req && txt.length < 5) { self.setState({ dlgErr: 'اكتب سبب واضح (5 حروف على الأقل).' }); return; }
        self.setState({ saving: true, saveErr: false });
        var id = self.state.selId, kind = self.state.dlg, sendWa = kind === 'approve' && self.state.waOn, msg = waText;
        setTimeout(function () {
          if (self.props.serverFails) { self.setState({ saving: false, saveErr: true }); return; }
          var now = new Date(), t = now.getDate() + ' أكتوبر ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
          var reqs = self.state.reqs.map(function (r) {
            if (r.id !== id) return r;
            var m = kind === 'approve' ? d.log + (txt ? ' «' + txt + '»' : '') : d.log + txt;
            var add = [{ t: t, m: m }];
            if (sendWa) add.push({ t: t, m: 'اتجهزت رسالة واتساب للعميل برقم الطلب ولينك التتبع.' });
            return Object.assign({}, r, { status: d.status, stage: kind === 'approve' && r.ctype !== 'person' ? 1 : r.stage, log: r.log.concat(add) });
          });
          self.setState({ reqs: reqs, saving: false, dlg: '', toast: d.toast + id + (sendWa ? ' — رسالة الواتساب جاهزة' : ''), toastWa: sendWa ? 'https://wa.me/?text=' + encodeURIComponent(msg) : '' });
        }, 900);
      },
      toast: s.toast, toastWa: s.toastWa, hideToast: function () { self.setState({ toast: '', toastWa: '' }); }
    };
  }
}
</script>
