<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>منشئ الطلب — الفرد 6: تم الإرسال</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="assets/dc-lite.js"></script>
</head>
<body>
<template id="dc-template"><x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{--bg:#f3faf8;--ink:#030909;--ink-strong:#030909;--muted:rgba(3,9,9,.62);--line:rgba(0,92,88,.12);--accent-ink:#005c58;--card-bg:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.62));--card-bd:rgba(255,255,255,.95);--card-sh:0 0 0 1px rgba(0,92,88,.1),inset 0 1px 0 #fff,0 14px 34px rgba(0,92,88,.12);--field-bg:rgba(255,255,255,.88);--field-bd:rgba(0,92,88,.25);--field-ink:#030909;--focus:#005c58;--focus-ring:rgba(126,232,199,.45);--soft-bg:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,255,255,.6));--soft-ink:#005c58;--soft-bd:rgba(0,92,88,.25);--cta-bg:linear-gradient(180deg,rgba(0,120,112,.94),rgba(0,43,40,.94));--chip-off-bg:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.55));--chip-off-ink:#005c58;--chip-off-bd:rgba(0,92,88,.2);--chip-on-bg:linear-gradient(180deg,#00706a,#004541);--chip-on-ink:#fff;--tint:linear-gradient(135deg,rgba(184,242,222,.45),rgba(126,232,199,.16));--tint-bd:rgba(0,92,88,.12);--tile-bg:linear-gradient(135deg,rgba(220,250,240,.9),rgba(184,242,222,.45));--tile-ink:#005c58;--hero-bg:#01302d;--hero-glow:rgba(0,92,88,.95);--panel-bg:#01302d;--warn-bg:#fbf3e2;--warn-ink:#5c430f;--warn-bd:#d6ae62;--ok-tint:linear-gradient(135deg,rgba(184,242,222,.7),rgba(126,232,199,.3));--img-bg:#e8f3f0;--opt-bg:#ffffff;--opt-ink:#030909;--arc:#f3faf8;--sel-ring:0 0 0 2px #00706a,0 0 22px rgba(126,232,199,.5)}
</style>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1)}
body{margin:0;background:var(--bg)}
*{box-sizing:border-box}
a{color:var(--accent-ink)}
input,select,textarea,button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dk :focus-visible{outline-color:#7ee8c7}
.page{position:relative;overflow:clip;isolation:isolate;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Cairo,'Segoe UI',Tahoma,sans-serif}
.card{background:var(--card-bg);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--card-bd);box-shadow:var(--card-sh)}
.glass-d{background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(126,232,199,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 22px rgba(126,232,199,.12)}
.h1{margin:0;font-weight:800;color:var(--ink-strong)}
.muted{color:var(--muted)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.neon-t{color:#7ee8c7;text-shadow:0 0 10px rgba(126,232,199,.55),0 0 26px rgba(126,232,199,.3)}
img[src="assets/7e9c2bf666d78520c5029e5857437282.svg"]{filter:drop-shadow(0 0 4px rgba(126,232,199,.75)) drop-shadow(0 0 12px rgba(126,232,199,.3))}
.g-btn{position:relative;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-decoration:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.g-btn[disabled]{opacity:.55;cursor:not-allowed}
.g-cta{background:var(--cta-bg);color:#fff;border:1.5px solid rgba(126,232,199,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 18px rgba(126,232,199,.12),0 0 18px rgba(126,232,199,.42),0 0 40px rgba(126,232,199,.18)}
.g-cta:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 26px rgba(126,232,199,.6),0 0 56px rgba(126,232,199,.26)}
.g-soft{background:var(--soft-bg);color:var(--soft-ink);border:1px solid var(--soft-bd)}
.g-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.fld{width:100%;min-height:50px;padding:10px 14px;border-radius:16px;border:1px solid var(--field-bd);background:var(--field-bg);color:var(--field-ink);font-size:16px;line-height:26px;box-shadow:inset 0 1px 2px rgba(0,43,40,.06)}
.fld:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring);outline:none}
.fld[aria-invalid="true"]{border:2px solid var(--warn-bd);background:var(--warn-bg)}
.fld option{background:var(--opt-bg);color:var(--opt-ink)}
.lbl{font-size:15px;font-weight:700;color:var(--ink-strong)}
.hint{font-size:13px;line-height:20px;color:var(--muted)}
.err{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--warn-ink)}
.tint{background:var(--tint);box-shadow:inset 0 0 0 1px var(--tint-bd);border-radius:18px}
.tile{display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--tile-bg);color:var(--tile-ink);box-shadow:0 0 0 1px var(--tint-bd)}
.opt{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 20px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt:focus-within,.ocard:focus-within,.cat:focus-within,.drop:focus-within{outline:2px solid var(--focus);outline-offset:3px}
.chip-off{background:var(--chip-off-bg);color:var(--chip-off-ink);border:1px solid var(--chip-off-bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 8px rgba(0,92,88,.06)}
.chip-on{background:var(--chip-on-bg);color:var(--chip-on-ink);border:1px solid rgba(126,232,199,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 16px rgba(126,232,199,.45)}
.ocard{position:relative;display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-radius:20px;cursor:pointer;background:var(--chip-off-bg);border:1px solid var(--chip-off-bd)}
.ocard input{position:absolute;opacity:0;width:1px;height:1px}
.ocard.on{background:var(--ok-tint);border-color:transparent;box-shadow:var(--sel-ring)}
.cat{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 10px 14px;border-radius:22px;cursor:pointer;background:var(--chip-off-bg);border:1px solid var(--chip-off-bd);box-shadow:0 8px 20px rgba(0,0,0,.06)}
.cat input{position:absolute;opacity:0;width:1px;height:1px}
.cat .cimg{height:130px;border-radius:16px;overflow:hidden;background:var(--img-bg)}
.cat .cimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--ease)}
.cat:hover .cimg img{transform:scale(1.06)}
.cat.on{background:var(--ok-tint);border-color:transparent;box-shadow:var(--sel-ring)}
.cat .tick{position:absolute;top:18px;left:18px;width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#b8f2de,#7ee8c7);color:#01302d;box-shadow:0 0 14px rgba(126,232,199,.8);opacity:0;transform:scale(.6);transition:opacity .4s var(--ease),transform .5s var(--ease)}
.cat.on .tick{opacity:1;transform:none}
.sum{margin:14px 0 0;display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:16px;font-size:15px;line-height:24px;font-weight:700}
.sum.ok{background:var(--ok-tint);color:var(--accent-ink);box-shadow:0 0 0 1px var(--tint-bd),0 0 16px rgba(126,232,199,.25)}
.sum.warn{background:var(--warn-bg);color:var(--warn-ink);box-shadow:inset 0 0 0 1px var(--warn-bd)}
.alert{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-ink);font-size:15px;font-weight:700}
.sw{position:relative;width:46px;height:26px;flex-shrink:0;border-radius:999px}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .45s var(--ease)}
.sw-on{background:linear-gradient(180deg,#00a08f,#00706a);box-shadow:0 0 12px rgba(126,232,199,.55)}
.sw-on::after{transform:translateX(-20px)}
.sw-off{background:rgba(3,9,9,.1);box-shadow:inset 0 0 0 1px var(--line)}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;padding:4px;border:0;background:transparent;color:#fff;cursor:pointer;font-family:inherit}
.step[disabled]{cursor:default}
.drop{position:relative;cursor:pointer}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.g-btn,.opt,.ocard,.cat,.step span,.sw,.lift{transition:background .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease),transform .5s var(--ease),color .35s var(--ease),opacity .4s var(--ease) !important}
.g-btn:hover,.cat:hover,.lift:hover{transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ring{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.anim-up{animation:fadeUp .8s var(--ease) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}
.fade{animation:fadeIn .5s var(--ease) both}
.pop{animation:pop .55s var(--ease) both}
.ring-in{animation:ring .8s var(--ease) both}
.floaty{animation:floaty 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</helmet>
<div class="page">

<!-- Hero band with nav + stepper -->
<header class="dk" style="position: relative; overflow: hidden; isolation: isolate; background: var(--hero-bg); color: #ffffff; padding: 16px 24px 70px">
<div aria-hidden="true" style="position: absolute; z-index: -1; inset: 0; background: radial-gradient(ellipse 55% 90% at 78% 10%, var(--hero-glow) 0%, rgba(0,0,0,0) 100%), radial-gradient(ellipse 40% 80% at 15% 90%, rgba(0,92,88,0.45) 0%, rgba(0,0,0,0) 100%)"></div>
<img src="assets/7e9c2bf666d78520c5029e5857437282.svg" alt="" aria-hidden="true" style="position: absolute; z-index: -1; top: -180px; left: -200px; width: 560px; height: 560px; opacity: .5; pointer-events: none">
<img src="assets/7e9c2bf666d78520c5029e5857437282.svg" alt="" aria-hidden="true" style="position: absolute; z-index: -1; top: -60px; right: -240px; width: 480px; height: 480px; transform: rotate(180deg); opacity: .35; pointer-events: none">
<div class="glass-d" style="max-width: 1280px; margin: 0 auto; border-radius: 26px; padding: 8px 12px 8px 16px; display: flex; align-items: center; gap: 14px">
<a href="{{homeHref}}" aria-label="يوزرسيف — الرئيسية"><img src="assets/a09b143d6b90eabfcff65a45080007f7.jpg" alt="شعار يوزرسيف" style="display: block; width: 56px; height: 56px; border-radius: 16px"></a>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<span style="font-size: 20px; line-height: 30px; font-weight: 800">ابدأ <span class="neon-t">طلبك</span></span>
<span style="font-size: 13px; color: rgba(255,255,255,0.75)">بياناتك محفوظة وإنت بتنقل بين الخطوات</span>
</div>
<span style="display: inline-flex; align-items: center; padding: 3px 14px; border-radius: 999px; background: rgba(126,232,199,0.12); border: 1px solid rgba(126,232,199,0.5); color: #b8f2de; font-size: 12px; font-weight: 700">وضع تجريبي — الطلب مش بيتبعت فعليًا</span>
<a class="g-btn g-ghost" href="{{homeHref}}" style="min-height: 44px; padding: 6px 18px; border-radius: 999px; font-size: 14px">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.2"><path d="M12 5l7 7-7 7M5 12h14"></path></svg>رجوع للموقع</a>
</div>

<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<nav aria-label="خطوات الطلب" style="max-width: 900px; margin: 30px auto 0; position: relative">
<span aria-hidden="true" style="position: absolute; top: 22px; right: 10%; left: 10%; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.14)"></span>
<span aria-hidden="true" style="{{railFill}}"></span>
<ol style="list-style: none; margin: 0; padding: 0; position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
<sc-for list="{{stepper}}" as="s" hint-placeholder-count="5">
<li><button class="step" type="button" onClick="{{s.go}}" disabled="{{s.locked}}" aria-current="{{s.current}}" aria-label="{{s.aria}}" style="width: 100%">
<span aria-hidden="true" style="{{s.dot}}">{{s.mark}}</span>
<span style="{{s.text}}">{{s.label}}</span>
</button></li>
</sc-for>
</ol>
</nav>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div style="height: 40px"></div>
</sc-if>
<div aria-hidden="true" style="position: absolute; left: -6%; right: -6%; bottom: -1px; height: 44px; background: var(--arc); border-radius: 50% 50% 0 0 / 100% 100% 0 0; box-shadow: 0 -1px 0 rgba(126,232,199,0.6), 0 -12px 28px rgba(126,232,199,0.22)"></div>
</header>

<main style="position: relative; isolation: isolate; max-width: 1280px; margin: 0 auto; padding: 8px 24px 64px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<img src="{{motif}}" alt="" aria-hidden="true" style="{{motifStyle}}">

<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<form class="card anim-up" novalidate="{{yes}}" aria-labelledby="step-h" onSubmit="{{onSubmitForm}}" style="flex: 999 1 560px; min-width: 0; border-radius: 30px; padding: 30px 32px; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; align-items: center; gap: 14px">
<span class="tile" aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="{{stepIcon}}"></path></svg></span>
<div style="display: flex; flex-direction: column">
<span class="muted" style="font-size: 13px; font-weight: 700">الخطوة {{stepNum}} من 5</span>
<h1 id="step-h" class="h1" tabindex="-1" style="font-size: 28px; line-height: 40px">{{stepTitle}}</h1>
</div>
</div>
<p class="muted" style="margin: -14px 0 0; font-size: 15px; line-height: 26px">{{stepHint}}</p>

<sc-if value="{{stepErrors}}" hint-placeholder-val="{{false}}">
<div class="alert pop" role="alert">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"></path></svg>
<span>{{stepErrorText}}</span>
</div>
</sc-if>

<!-- STEP 1 -->
<sc-if value="{{is1}}" hint-placeholder-val="{{true}}">
<div class="fade" style="display: flex; flex-direction: column; gap: 26px">
<fieldset id="f-ctype" tabindex="-1" style="margin: 0; padding: 0; border: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 14px">الطلب ده لمين؟</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{ctypes}}" as="t" hint-placeholder-count="3">
<label class="{{t.cls}}"><input type="radio" name="ctype" checked="{{t.checked}}" onChange="{{t.pick}}">
<span class="tile" aria-hidden="true" style="width: 46px; height: 46px"><svg class="ic" viewBox="0 0 24 24"><path d="{{t.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800; color: var(--ink-strong)">{{t.label}}</span><span class="muted" style="font-size: 13px; line-height: 20px">{{t.desc}}</span></span></label>
</sc-for>
</div>
<sc-if value="{{e.ctype}}" hint-placeholder-val="{{false}}"><p class="err" style="margin: 8px 0 0">{{e.ctype}}</p></sc-if>
</fieldset>
<sc-if value="{{isOrg}}" hint-placeholder-val="{{false}}">
<div class="tint pop" style="padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
<span class="tile" aria-hidden="true" style="width: 40px; height: 40px"><svg class="ic" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 12l2 2 4-4"></path></svg></span>
<span style="font-size: 14px; line-height: 24px"><strong style="color: var(--ink-strong)">طلبات {{orgWord}} ليها مسار خاص:</strong> عرض سعر رسمي، موكاب أو عينة تعتمدها قبل الإنتاج، وتسليم مرة واحدة أو على دفعات، مع فاتورة لو محتاجها.</span>
</div>
</sc-if>
<fieldset id="f-cat" tabindex="-1" style="margin: 0; padding: 0; border: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 14px">إنت عايز تطبع على إيه؟</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<label class="{{c.cls}}">
<input type="radio" name="cat" value="{{c.id}}" checked="{{c.checked}}" onChange="{{c.pick}}">
<span class="cimg"><img src="{{c.img}}" alt=""></span>
<span class="tick" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg></span>
<span style="padding: 4px 6px 0; font-size: 16px; line-height: 26px; font-weight: 800; color: var(--ink-strong)">{{c.label}}</span>
<span class="muted" style="padding: 0 6px; font-size: 13px; line-height: 20px">{{c.desc}}</span>
</label>
</sc-for>
</div>
</fieldset>
<p class="tint" style="margin: 0; padding: 12px 16px; font-size: 14px; line-height: 24px">عاجبك شغل من <a href="{{galleryHref}}" style="font-weight: 700">أعمالنا</a>؟ اختار «استخدمه كمرجع» من هناك وهيتضاف لطلبك تلقائيًا.</p>
</div>
</sc-if>

<!-- STEP 2 -->
<sc-if value="{{is2}}" hint-placeholder-val="{{false}}">
<div class="fade" style="display: flex; flex-direction: column; gap: 24px">

<sc-if value="{{hasProds}}" hint-placeholder-val="{{true}}">
<fieldset id="f-prod" tabindex="-1" style="margin: 0; padding: 0; border: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 12px">نوع المنتج</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{prods}}" as="p" hint-placeholder-count="4">
<label class="{{p.cls}}"><input type="radio" name="prod" checked="{{p.checked}}" onChange="{{p.pick}}">{{p.label}}</label>
</sc-for>
</div>
<sc-if value="{{e.prod}}" hint-placeholder-val="{{false}}"><p class="err" style="margin: 8px 0 0">{{e.prod}}</p></sc-if>
</fieldset>
</sc-if>

<sc-if value="{{isWear}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-color">اللون</label>
<select class="fld" id="f-color" value="{{v.color}}" onChange="{{on.color}}" aria-invalid="{{inv.color}}" aria-describedby="h-color">
<option value="">اختار اللون</option><option value="white">أبيض</option><option value="black">أسود</option><option value="other">لون تاني (اكتبه في الملاحظات)</option>
</select>
<span id="h-color" class="hint">الألوان المتاحة بتتأكد مع يوزرسيف.</span>
<sc-if value="{{e.color}}" hint-placeholder-val="{{false}}"><span class="err">{{e.color}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-qty">الكمية الكلية</label>
<input class="fld" id="f-qty" type="text" inputmode="numeric" autocomplete="off" value="{{v.qty}}" onChange="{{on.qty}}" aria-invalid="{{inv.qty}}" aria-describedby="h-qty">
<span id="h-qty" class="hint">عدد القطع كلها، بكل المقاسات.</span>
<sc-if value="{{e.qty}}" hint-placeholder-val="{{false}}"><span class="err">{{e.qty}}</span></sc-if>
</div>
</div>
<sc-if value="{{hasSizes}}" hint-placeholder-val="{{true}}">
<fieldset id="f-sizes" tabindex="-1" aria-describedby="h-sizes" class="tint" style="margin: 0; padding: 18px 20px 20px; border: 0">
<legend class="lbl" style="padding: 0; float: right; width: 100%; margin-bottom: 14px">توزيع المقاسات</legend>

</div>
</sc-for>
</div>
<p id="h-sizes" aria-live="polite" class="{{sumCls}}">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="{{sumIcon}}"></path></svg>
<span>{{sumText}}</span></p>
</fieldset>
</sc-if>
<fieldset id="f-place" tabindex="-1" style="margin: 0; padding: 0; border: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 12px">مكان الطباعة <span class="muted" style="font-weight: 500">(تقدر تختار أكتر من مكان)</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{placesF}}" as="p" hint-placeholder-count="3">
<label class="{{p.cls}}"><input type="checkbox" checked="{{p.checked}}" onChange="{{p.toggle}}">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2"><path d="{{p.icon}}"></path></svg>{{p.label}}</label>
</sc-for>
</div>
<sc-if value="{{e.place}}" hint-placeholder-val="{{false}}"><p class="err" style="margin: 8px 0 0">{{e.place}}</p></sc-if>
</fieldset>
</div>
</sc-if>

<sc-if value="{{isMug}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-qty">الكمية</label>
<input class="fld" id="f-qty" type="text" inputmode="numeric" value="{{v.qty}}" onChange="{{on.qty}}" aria-invalid="{{inv.qty}}">
<sc-if value="{{e.qty}}" hint-placeholder-val="{{false}}"><span class="err">{{e.qty}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-text">نص التخصيص <span class="muted" style="font-weight: 500">(اختياري)</span></label>
<input class="fld" id="f-text" type="text" value="{{v.text}}" onChange="{{on.text}}" placeholder="مثلًا: اسم أو جملة قصيرة">
</div>
</div>
</sc-if>

<sc-if value="{{isPhone}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-model">موديل الموبايل</label>
<input class="fld" id="f-model" type="text" autocomplete="off" value="{{v.model}}" onChange="{{on.model}}" placeholder="مثلًا: iPhone 13 أو Samsung A54" aria-invalid="{{inv.model}}" aria-describedby="h-model">
<span id="h-model" class="hint">اكتب الموديل بالظبط عشان الكفر يركب صح. الموديلات المتاحة بتتأكد بعد المراجعة.</span>
<sc-if value="{{e.model}}" hint-placeholder-val="{{false}}"><span class="err">{{e.model}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-qty">الكمية</label>
<input class="fld" id="f-qty" type="text" inputmode="numeric" value="{{v.qty}}" onChange="{{on.qty}}" aria-invalid="{{inv.qty}}">
<sc-if value="{{e.qty}}" hint-placeholder-val="{{false}}"><span class="err">{{e.qty}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; grid-column: 1 / -1">
<label class="lbl" for="f-text">نص أو اسم على الكفر <span class="muted" style="font-weight: 500">(اختياري)</span></label>
<input class="fld" id="f-text" type="text" value="{{v.text}}" onChange="{{on.text}}">
</div>
</div>
</sc-if>

<sc-if value="{{isSticker}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 24px">
<fieldset id="f-dims" tabindex="-1" style="margin: 0; padding: 0; border: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 12px">المقاس</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-w" style="font-size: 14px; font-weight: 700">العرض</label><input class="fld" id="f-w" type="text" inputmode="decimal" value="{{v.w}}" onChange="{{on.w}}" aria-invalid="{{inv.dims}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-h" style="font-size: 14px; font-weight: 700">الطول</label><input class="fld" id="f-h" type="text" inputmode="decimal" value="{{v.h}}" onChange="{{on.h}}" aria-invalid="{{inv.dims}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-unit" style="font-size: 14px; font-weight: 700">الوحدة</label>
<select class="fld" id="f-unit" value="{{v.unit}}" onChange="{{on.unit}}" aria-invalid="{{inv.unit}}"><option value="">اختار</option><option value="cm">سم</option><option value="mm">مم</option></select></div>
</div>
<sc-if value="{{e.dims}}" hint-placeholder-val="{{false}}"><p class="err" style="margin: 8px 0 0">{{e.dims}}</p></sc-if>
</fieldset>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-shape">الشكل</label>
<select class="fld" id="f-shape" value="{{v.shape}}" onChange="{{on.shape}}" aria-invalid="{{inv.shape}}"><option value="">اختار الشكل</option><option value="circle">دائري</option><option value="square">مربع</option><option value="rect">مستطيل</option><option value="cut">مقصوص على شكل التصميم</option></select>
<sc-if value="{{e.shape}}" hint-placeholder-val="{{false}}"><span class="err">{{e.shape}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-qty">الكمية</label>
<input class="fld" id="f-qty" type="text" inputmode="numeric" value="{{v.qty}}" onChange="{{on.qty}}" aria-invalid="{{inv.qty}}">
<sc-if value="{{e.qty}}" hint-placeholder-val="{{false}}"><span class="err">{{e.qty}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; grid-column: 1 / -1">
<label class="lbl" for="f-use">هتستخدمه في إيه؟ <span class="muted" style="font-weight: 500">(اختياري)</span></label>
<input class="fld" id="f-use" type="text" value="{{v.use}}" onChange="{{on.use}}" placeholder="مثلًا: تغليف منتجات، لابتوب، عربية">
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isCustom}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-desc">احكيلنا فكرتك</label>
<textarea class="fld" id="f-desc" rows="5" value="{{v.desc}}" onChange="{{on.desc}}" aria-invalid="{{inv.desc}}" aria-describedby="h-desc" style="resize: vertical"></textarea>
<span id="h-desc" class="hint">المنتج، الكمية التقريبية، والمناسبة. كل ما تفاصيلك أوضح، ردنا أسرع.</span>
<sc-if value="{{e.desc}}" hint-placeholder-val="{{false}}"><span class="err">{{e.desc}}</span></sc-if>
</div>
</sc-if>

<sc-if value="{{bigQtyHint}}" hint-placeholder-val="{{false}}">
<div class="tint fade" style="padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; line-height: 24px">
<span style="flex: 1 1 260px">كمية كبيرة؟ لو الطلب ده لشركة أو محل أو فريق، اختار ده عشان تاخد مسار الطلبات الكبيرة (عرض سعر رسمي وعينة قبل الإنتاج).</span>
<button class="g-btn g-soft" type="button" onClick="{{switchToBiz}}" style="min-height: 40px; padding: 4px 16px; border-radius: 999px; font-size: 13px">الطلب لشركة أو محل</button>
</div>
</sc-if>
<sc-if value="{{isOrg}}" hint-placeholder-val="{{false}}">
<fieldset id="f-bulk" class="tint" style="margin: 0; padding: 18px 20px 20px; border: 0">
<legend class="lbl" style="padding: 0; float: right; width: 100%; margin-bottom: 4px">خيارات الطلبات الكبيرة</legend>
<p class="hint" style="clear: both; margin: 0 0 14px">اختار اللي يناسبك، وتقدر تغيّره بعدين مع فريق يوزرسيف.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<sc-for list="{{bulkOpts}}" as="b" hint-placeholder-count="3">
<label class="{{b.cls}}"><input type="checkbox" checked="{{b.checked}}" onChange="{{b.toggle}}">
<span aria-hidden="true" class="{{b.sw}}" style="margin-top: 2px"></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800; color: var(--ink-strong)">{{b.label}}</span><span class="muted" style="font-size: 13px; line-height: 20px">{{b.desc}}</span></span></label>
</sc-for>
</div>
<sc-if value="{{v.batches}}" hint-placeholder-val="{{false}}">
<div class="fade" style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px">
<label class="lbl" for="f-batch">إزاي تحب تقسّم الدفعات؟</label>
<textarea class="fld" id="f-batch" rows="2" value="{{v.batchNotes}}" onChange="{{on.batchNotes}}" aria-invalid="{{inv.batch}}" placeholder="مثلًا: 100 قطعة قبل يوم 10، والباقي بعدها بأسبوعين" style="resize: vertical"></textarea>
<sc-if value="{{e.batch}}" hint-placeholder-val="{{false}}"><span class="err">{{e.batch}}</span></sc-if>
</div>
</sc-if>
</fieldset>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-notes">ملاحظات إضافية <span class="muted" style="font-weight: 500">(اختياري)</span></label>
<textarea class="fld" id="f-notes" rows="3" value="{{v.notes}}" onChange="{{on.notes}}" style="resize: vertical"></textarea>
</div>
</div>
</sc-if>

<!-- STEP 3 -->
<sc-if value="{{is3}}" hint-placeholder-val="{{false}}">
<div class="fade" style="display: flex; flex-direction: column; gap: 18px">
<label id="f-files" class="drop" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 24px; border-radius: 24px; border: 2px dashed var(--field-bd); background: var(--tint); text-align: center">
<input type="file" multiple="{{yes}}" accept="{{acceptExt}}" onChange="{{onFiles}}" aria-describedby="h-files">
<span class="tile floaty" aria-hidden="true" style="width: 64px; height: 64px; border-radius: 999px; box-shadow: 0 0 0 1px var(--tint-bd), 0 0 22px rgba(126,232,199,0.45)"><svg class="ic" viewBox="0 0 24 24" style="width: 30px; height: 30px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg></span>
<span style="font-size: 18px; font-weight: 800; color: var(--ink-strong)">اختار ملفات التصميم أو الصور المرجعية</span>
<span id="h-files" class="hint" style="font-size: 14px">{{extText}} — حتى 20 ميجا للملف [الحد بانتظار التأكيد]</span>
</label>
<sc-if value="{{v.perPiece}}" hint-placeholder-val="{{false}}">
<div class="alert fade" style="font-weight: 600">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h2M14 13h2M8 17h2M14 17h2"></path></svg>
<span style="flex-grow: 1">إنت اخترت أسماء أو أرقام مختلفة على كل قطعة: ارفع شيت (Excel أو CSV أو PDF) فيه الاسم أو الرقم والمقاس لكل قطعة. <span style="{{sheetState}}">{{sheetText}}</span></span>
</div>
</sc-if>
<button class="g-btn g-soft" type="button" onClick="{{addDemoFile}}" style="align-self: flex-start; min-height: 42px; padding: 6px 18px; border-radius: 999px; font-size: 14px">أضف ملف تجريبي</button>
<sc-if value="{{v.perPiece}}" hint-placeholder-val="{{false}}"><button class="g-btn g-soft" type="button" onClick="{{addDemoSheet}}" style="align-self: flex-start; min-height: 42px; padding: 6px 18px; border-radius: 999px; font-size: 14px">أضف شيت أسماء تجريبي</button></sc-if>
<sc-if value="{{hasFiles}}" hint-placeholder-val="{{false}}">
<ul aria-label="الملفات المرفوعة" aria-live="polite" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{files}}" as="f" hint-placeholder-count="2">
<li class="card pop" style="display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 20px">
<sc-if value="{{f.thumb}}" hint-placeholder-val="{{false}}"><img src="{{f.thumb}}" alt="" style="width: 56px; height: 56px; border-radius: 14px; object-fit: cover; background: var(--img-bg)"></sc-if>
<sc-if value="{{f.noThumb}}" hint-placeholder-val="{{true}}"><span class="tile" aria-hidden="true" style="width: 56px; height: 56px"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8"></path></svg></span></sc-if>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: right; color: var(--ink-strong)">{{f.name}}</span>
<span style="{{f.statusStyle}}">{{f.statusText}}</span>
<sc-if value="{{f.uploading}}" hint-placeholder-val="{{false}}"><div role="progressbar" aria-label="{{f.progLabel}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{f.progress}}" style="height: 6px; border-radius: 999px; background: var(--line); overflow: hidden"><div style="{{f.barStyle}}"></div></div></sc-if>
</div>
<sc-if value="{{f.canRetry}}" hint-placeholder-val="{{false}}"><button class="g-btn g-soft" type="button" onClick="{{f.retry}}" style="min-height: 40px; padding: 4px 14px; border-radius: 999px; font-size: 13px">إعادة المحاولة</button></sc-if>
<button class="g-btn g-soft" type="button" onClick="{{f.remove}}" aria-label="{{f.removeLabel}}" style="width: 40px; height: 40px; border-radius: 999px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
</li>
</sc-for>
</ul>
</sc-if>
<p class="tint" style="margin: 0; padding: 12px 16px; font-size: 14px; line-height: 24px">رفع الملف بنجاح مش معناه إنه جاهز للطباعة. يوزرسيف هيراجع الدقة والمقاس ويبلغك لو محتاج تعديل.</p>
<label id="f-help" class="{{helpCls}}">
<input type="checkbox" checked="{{v.help}}" onChange="{{on.help}}">
<span aria-hidden="true" class="{{helpSw}}" style="margin-top: 2px"></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800; color: var(--ink-strong)">محتاج مساعدة في التصميم</span><span class="muted" style="font-size: 13px; line-height: 20px">مفيش تصميم جاهز؟ اوصف فكرتك تحت وإحنا نساعدك.</span></span>
</label>
<sc-if value="{{e.art}}" hint-placeholder-val="{{false}}"><p class="err" style="margin: 0">{{e.art}}</p></sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-artnotes">ملاحظات عن التصميم <span class="muted" style="font-weight: 500">(اختياري)</span></label>
<textarea class="fld" id="f-artnotes" rows="3" value="{{v.artNotes}}" onChange="{{on.artNotes}}" placeholder="الألوان، الخط، المقاس على المنتج…" style="resize: vertical"></textarea>
</div>
</div>
</sc-if>

<!-- STEP 4 -->
<sc-if value="{{is4}}" hint-placeholder-val="{{false}}">
<div class="fade" style="display: flex; flex-direction: column; gap: 24px">
<sc-if value="{{isOrg}}" hint-placeholder-val="{{false}}">
<fieldset class="tint" style="margin: 0; padding: 18px 20px 20px; border: 0">
<legend class="lbl" style="padding: 0; float: right; width: 100%; margin-bottom: 14px">بيانات {{orgWordOne}}</legend>
<div style="clear: both; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-org">{{orgLabel}}</label>
<input class="fld" id="f-org" type="text" autocomplete="organization" value="{{v.org}}" onChange="{{on.org}}" aria-invalid="{{inv.org}}">
<sc-if value="{{e.org}}" hint-placeholder-val="{{false}}"><span class="err">{{e.org}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-role">صفتك <span class="muted" style="font-weight: 500">(اختياري)</span></label>
<input class="fld" id="f-role" type="text" autocomplete="organization-title" value="{{v.role}}" onChange="{{on.role}}" placeholder="{{rolePh}}">
</div>
<label class="{{invCls}}" style="grid-column: 1 / -1">
<input type="checkbox" checked="{{v.invoice}}" onChange="{{on.invoice}}">
<span aria-hidden="true" class="{{invSw}}" style="margin-top: 2px"></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800; color: var(--ink-strong)">محتاج فاتورة باسم {{orgWordOne}}</span><span class="muted" style="font-size: 13px; line-height: 20px">بيانات الفاتورة بتتأكد معاك قبل إصدارها. [نوع الفاتورة بانتظار تأكيد يوزرسيف]</span></span>
</label>
<sc-if value="{{v.invoice}}" hint-placeholder-val="{{false}}">
<div class="fade" style="display: flex; flex-direction: column; gap: 8px; grid-column: 1 / -1">
<label class="lbl" for="f-tax">رقم البطاقة الضريبية أو السجل التجاري <span class="muted" style="font-weight: 500">(اختياري دلوقتي)</span></label>
<input class="fld" id="f-tax" type="text" inputmode="numeric" dir="ltr" value="{{v.taxId}}" onChange="{{on.taxId}}" style="text-align: right">
</div>
</sc-if>
</div>
</fieldset>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-name">{{nameLabel}}</label>
<input class="fld" id="f-name" type="text" autocomplete="name" value="{{v.name}}" onChange="{{on.name}}" aria-invalid="{{inv.name}}">
<sc-if value="{{e.name}}" hint-placeholder-val="{{false}}"><span class="err">{{e.name}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-phone">رقم الموبايل</label>
<input class="fld" id="f-phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" value="{{v.phone}}" onChange="{{on.phone}}" placeholder="01xxxxxxxxx" aria-invalid="{{inv.phone}}" aria-describedby="h-phone" style="text-align: right">
<span id="h-phone" class="hint">هنستخدمه للتواصل معاك وللتأكد من هويتك وإنت بتتابع الطلب.</span>
<sc-if value="{{e.phone}}" hint-placeholder-val="{{false}}"><span class="err">{{e.phone}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-email">الإيميل <span class="muted" style="font-weight: 500">(اختياري)</span></label>
<input class="fld" id="f-email" type="email" inputmode="email" autocomplete="email" dir="ltr" value="{{v.email}}" onChange="{{on.email}}" aria-invalid="{{inv.email}}" style="text-align: right">
<sc-if value="{{e.email}}" hint-placeholder-val="{{false}}"><span class="err">{{e.email}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="f-date">التاريخ اللي تحب تستلم فيه <span class="muted" style="font-weight: 500">(اختياري)</span></label>

<sc-if value="{{e.date}}" hint-placeholder-val="{{false}}"><span class="err">{{e.date}}</span></sc-if>
</div>
</div>
<fieldset id="f-receipt" tabindex="-1" style="margin: 0; padding: 0; border: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 12px">طريقة الاستلام</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<sc-for list="{{receipts}}" as="r" hint-placeholder-count="2">

<script type="text/x-dc" data-dc-script data-props='{"simulateFailure":{"editor":"boolean","default":false,"section":"Demo"},"$preview":{"width":1440,"height":1250}}'>

  fresh() {
    return { step: 1, maxStep: 1, ctype: '', org: '', role: '', invoice: false, taxId: '', sample: false, perPiece: false, batches: false, batchNotes: '', cat: '', prod: '', color: '', qty: '', sizes: { S: '', M: '', L: '', XL: '', XXL: '' }, places: [], text: '', model: '', w: '', h: '', unit: '', shape: '', use: '', desc: '', notes: '', files: [], help: false, artNotes: '', name: '', phone: '', email: '', date: '', receipt: '', showErr: {}, submitting: false, submitError: false, failedOnce: false, ref: '' };
