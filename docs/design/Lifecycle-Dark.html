</div>

<dt>واتساب</dt><dd>{{s.wa}}</dd>
<dt>لوحة الإدارة</dt><dd>{{s.admin}}</dd>
</dl>
</div>
</li>
</sc-for>
</ol>
</section>
</sc-for>
</div>

</div>
<sc-for list="{{diffs}}" as="r" hint-placeholder-count="7">
<div role="row" class="grid-t" style="{{r.bg}}">
<div role="rowheader" style="font-weight: 800; color: var(--ink-strong)">{{r.k}}</div><div role="cell">{{r.a}}</div><div role="cell">{{r.b}}</div>
</div>
</sc-for>
</div>
</section>

<!-- Exceptions -->
<section class="anim-up d3" aria-labelledby="ex-h" style="display: flex; flex-direction: column; gap: 16px">
<h2 id="ex-h" class="h2">الحالات الاستثنائية</h2>

<sc-for list="{{exceptions}}" as="x" hint-placeholder-count="4">

<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--warn-bg); color: var(--warn-ink); box-shadow: inset 0 0 0 1px var(--warn-bd)"><svg class="ic" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{x.icon}}"></path></svg></span>
<strong style="font-size: 16px; line-height: 26px; color: var(--ink-strong)">{{x.t}}</strong>
<span style="font-size: 14px; line-height: 23px">{{x.d}}</span>
</article>
</sc-for>
</div>
</section>

</sc-for>
</section>
</main>
</div>
