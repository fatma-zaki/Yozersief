<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الحسابات والصلاحيات — لوحة الإدارة</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="assets/dc-lite.js"></script>
</head>
<body>
<template id="dc-template"><x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{--bg:#f3faf8;--ink:#030909;--ink-strong:#030909;--muted:rgba(3,9,9,.6);--line:rgba(0,92,88,.12);--accent-ink:#005c58;--card-bg:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.6));--card-bd:rgba(255,255,255,.95);--card-sh:0 0 0 1px rgba(0,92,88,.1),inset 0 1px 0 #fff,0 10px 26px rgba(0,92,88,.1);--bar-sh:0 0 0 1px rgba(126,232,199,.5),inset 0 1px 0 #fff,0 0 22px rgba(126,232,199,.2),0 12px 30px rgba(0,92,88,.1);--field-bg:rgba(255,255,255,.85);--field-bd:rgba(0,92,88,.25);--field-ink:#030909;--focus:#005c58;--focus-ring:rgba(126,232,199,.45);--soft-bg:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,255,255,.6));--soft-ink:#005c58;--soft-bd:rgba(0,92,88,.25);--cta-bg:linear-gradient(180deg,rgba(0,120,112,.92),rgba(0,43,40,.92));--chip-off-bg:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.5));--chip-off-ink:#005c58;--chip-off-bd:rgba(0,92,88,.18);--chip-on-bg:linear-gradient(180deg,#00706a,#004541);--chip-on-ink:#fff;--tint:linear-gradient(135deg,rgba(184,242,222,.45),rgba(126,232,199,.16));--tint-bd:rgba(0,92,88,.12);--tile-bg:linear-gradient(135deg,rgba(220,250,240,.9),rgba(184,242,222,.45));--tile-ink:#005c58;--side-bg:#01302d;--side-glow:rgba(0,92,88,.95);--warn-bg:rgba(214,174,98,.22);--warn-ink:#5c430f;--warn-bd:#d6ae62;--ok-bg:linear-gradient(180deg,#00706a,#004541);--ok-ink:#fff;--off-bg:rgba(3,9,9,.08);--off-ink:rgba(3,9,9,.6);--overlay:rgba(0,43,40,.45);--sheet-bg:linear-gradient(180deg,rgba(255,255,255,.98),rgba(243,250,248,.97));--toast-bg:#01302d;--img-bg:#e8f3f0;--opt-bg:#ffffff;--opt-ink:#030909}
</style>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1)}
body{margin:0;background:var(--bg)}
*{box-sizing:border-box}
a{color:var(--accent-ink)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.side :focus-visible{outline-color:#7ee8c7}
.page{position:relative;overflow:clip;isolation:isolate;min-height:100vh;display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px;padding:16px;background:var(--bg);color:var(--ink);font-family:Cairo,'Segoe UI',Tahoma,sans-serif}
.card{background:var(--card-bg);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--card-bd);box-shadow:var(--card-sh);border-radius:26px}
.bar{border-radius:24px;padding:12px 14px 12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;box-shadow:var(--bar-sh)}
.side{position:sticky;top:16px;overflow:hidden;isolation:isolate;flex:1 1 248px;max-width:100%;min-height:calc(100vh - 32px);background:var(--side-bg);color:#fff;border-radius:28px;padding:20px 14px;display:flex;flex-direction:column;gap:22px;border:1px solid rgba(126,232,199,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 26px rgba(126,232,199,.16),0 20px 44px rgba(0,0,0,.25)}
.side-glow{position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse 120% 50% at 70% 0%,var(--side-glow) 0%,rgba(0,0,0,0) 100%)}
.side-l{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;border-radius:16px;font-size:15px;font-weight:700;color:rgba(255,255,255,.8);text-decoration:none;border:1px solid transparent}
.side-l:hover{background:rgba(255,255,255,.07);color:#fff}
.side-l[aria-current="page"]{background:linear-gradient(180deg,rgba(126,232,199,.28),rgba(126,232,199,.1));color:#fff;border-color:rgba(126,232,199,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 18px rgba(126,232,199,.3)}
.main-col{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
.h1{margin:0;font-size:24px;line-height:36px;font-weight:800;color:var(--ink-strong)}
.h2{margin:0;font-size:17px;line-height:28px;font-weight:800;color:var(--ink-strong)}
.muted{color:var(--muted)}
.g-btn{position:relative;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-decoration:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.g-btn[disabled]{opacity:.5;cursor:not-allowed}
.g-cta{background:var(--cta-bg);color:#fff;border:1.5px solid rgba(126,232,199,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 18px rgba(126,232,199,.12),0 0 18px rgba(126,232,199,.42),0 0 40px rgba(126,232,199,.18)}
.g-soft{background:var(--soft-bg);color:var(--soft-ink);border:1px solid var(--soft-bd)}
.g-line{background:transparent;color:var(--ink);border:1px solid var(--field-bd)}
.fld{width:100%;min-height:46px;padding:8px 14px;border-radius:14px;border:1px solid var(--field-bd);background:var(--field-bg);color:var(--field-ink);font-size:15px}
.fld:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring);outline:none}
.fld option{background:var(--opt-bg);color:var(--opt-ink)}
.lbl{font-size:13px;font-weight:700}
.tint{background:var(--tint);box-shadow:inset 0 0 0 1px var(--tint-bd);border-radius:16px}
.tile{display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--tile-bg);color:var(--tile-ink);box-shadow:0 0 0 1px var(--tint-bd)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.neon-t{color:#7ee8c7;text-shadow:0 0 10px rgba(126,232,199,.55),0 0 26px rgba(126,232,199,.3)}
img[src="assets/7e9c2bf666d78520c5029e5857437282.svg"]{filter:drop-shadow(0 0 4px rgba(126,232,199,.75)) drop-shadow(0 0 12px rgba(126,232,199,.3))}
.sw{position:relative;width:46px;height:26px;flex-shrink:0;border:0;padding:0;border-radius:999px;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .45s var(--ease)}
.sw-on{background:linear-gradient(180deg,#00a08f,#00706a);box-shadow:0 0 12px rgba(126,232,199,.55)}
.sw-on::after{transform:translateX(-20px)}
.sw-off{background:var(--off-bg);box-shadow:inset 0 0 0 1px var(--line)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:11px;line-height:20px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok-ink);box-shadow:0 0 10px rgba(126,232,199,.35)}
.b-warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-bd)}
.b-off{background:var(--off-bg);color:var(--off-ink)}
.b-role{background:var(--tint);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--tint-bd)}
.toast{position:fixed;bottom:24px;left:24px;z-index:40;max-width:460px;display:flex;gap:10px;align-items:center;padding:12px 14px 12px 18px;border-radius:20px;background:var(--toast-bg);color:#fff;font-size:15px;font-weight:600;border:1px solid rgba(126,232,199,.55);box-shadow:0 0 26px rgba(126,232,199,.3),0 16px 34px rgba(0,0,0,.3)}
.g-btn,.side-l,.sw,.lift,.cb{transition:background .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease),transform .5s var(--ease),color .35s var(--ease),opacity .4s var(--ease) !important}
.g-btn:hover,.lift:hover{transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.anim-up{animation:fadeUp .8s var(--ease) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.slide{animation:slideIn .6s var(--ease) both}
.fade{animation:fadeIn .4s var(--ease) both}
.pop{animation:pop .5s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
.mrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,.8fr);align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:var(--tint);box-shadow:inset 0 0 0 1px var(--tint-bd);font-size:14px}
.mh{font-size:12px;font-weight:700;color:var(--muted)}
.xrow{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(5,minmax(0,1fr));align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.cb{width:30px;height:30px;border-radius:10px;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.cb-on{background:linear-gradient(180deg,#00a08f,#00706a);color:#fff;box-shadow:0 0 10px rgba(126,232,199,.55)}
.cb-off{background:transparent;color:transparent;box-shadow:inset 0 0 0 1.5px var(--field-bd)}
.cb[disabled]{cursor:not-allowed;opacity:.75}
</style>
</helmet>
<div class="page">
<img src="assets/09db2274cf741cc3e59da087108d65f1.svg" alt="" aria-hidden="true" style="position: absolute; z-index: -1; top: 320px; left: -240px; width: 680px; height: 680px; pointer-events: none">

<nav class="side slide" aria-label="قائمة الإدارة">
<div class="side-glow" aria-hidden="true"></div>
<img src="assets/7e9c2bf666d78520c5029e5857437282.svg" alt="" aria-hidden="true" style="position: absolute; z-index: -1; bottom: -170px; right: -190px; width: 460px; height: 460px; opacity: .5; pointer-events: none">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 6px">
<img src="assets/a09b143d6b90eabfcff65a45080007f7.jpg" alt="شعار يوزرسيف" style="width: 56px; height: 56px; border-radius: 16px; box-shadow: 0 0 0 1px rgba(126,232,199,0.4), 0 0 18px rgba(126,232,199,0.25)">
<span style="display: flex; flex-direction: column"><strong style="font-size: 17px">لوحة <span class="neon-t">الإدارة</span></strong><span style="font-size: 12px; color: rgba(255,255,255,0.7)">بيئة تجريبية</span></span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
<li><a class="side-l" href="{{n.href}}" aria-current="{{n.cur}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.icon}}"></path></svg><span style="flex-grow: 1">{{n.label}}</span>
<sc-if value="{{n.count}}" hint-placeholder-val="{{false}}"><span style="min-width: 24px; padding: 0 8px; border-radius: 999px; background: #d6ae62; color: #030909; font-size: 12px; font-weight: 800; text-align: center">{{n.count}}</span></sc-if></a></li>
</sc-for>
</ul>
<div style="margin-top: auto; padding: 12px; border-radius: 20px; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(126,232,199,0.3)">
<span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 999px; background: linear-gradient(180deg,#b8f2de,#7ee8c7); color: #01302d; display: flex; align-items: center; justify-content: center; font-weight: 800">ي</span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">صاحب المحل</span><span style="font-size: 12px; color: rgba(255,255,255,0.7)">مدير</span></span>
<a href="{{homeHref}}" style="padding: 6px 10px; border-radius: 12px; color: #b8f2de; font-size: 13px; font-weight: 700; text-decoration: none; border: 1px solid rgba(126,232,199,0.35)">خروج</a>
</div>
</nav>

<div class="main-col">
<header class="card bar anim-up">
<div style="flex-grow: 1; display: flex; flex-direction: column">
<h1 class="h1">الحسابات والصلاحيات</h1>
<span class="muted" style="font-size: 13px">مين يقدر يدخل لوحة الإدارة، وكل واحد يقدر يعمل إيه</span>
</div>
<button class="g-btn g-cta" type="button" onClick="{{openInvite}}" style="min-height: 46px; padding: 8px 22px; border-radius: 999px; font-size: 15px">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M13 7a4 4 0 1 1-8 0 4 4 0 1 1 8 0M19 8v6M22 11h-6"></path></svg>دعوة عضو</button>
</header>

<section class="card anim-up d1" aria-labelledby="mem-h" style="padding: 18px 20px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 id="mem-h" class="h2">الأعضاء</h2><span class="muted" style="font-size: 12px">{{memberCount}} أعضاء</span></div>
<div role="table" aria-label="الأعضاء" style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px">
<div role="row" class="mrow" style="padding-top: 0; padding-bottom: 0; background: transparent; box-shadow: none">
<span role="columnheader" class="mh">العضو</span><span role="columnheader" class="mh">الدور</span><span role="columnheader" class="mh">الحالة</span><span role="columnheader" class="mh">آخر نشاط</span><span role="columnheader" class="mh"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">إجراءات</span></span>
</div>
<sc-for list="{{members}}" as="m" hint-placeholder-count="3">
<div role="row" class="mrow fade">
<span role="cell" style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="{{m.avatar}}">{{m.initial}}</span><span style="display: flex; flex-direction: column"><strong style="color: var(--ink-strong)">{{m.name}}</strong><span dir="ltr" class="muted" style="font-size: 12px; text-align: right">{{m.contact}}</span></span></span>
<span role="cell"><sc-if value="{{m.locked}}" hint-placeholder-val="{{true}}"><span class="badge b-role">{{m.roleLabel}}</span></sc-if><sc-if value="{{m.editable}}" hint-placeholder-val="{{false}}"><select class="fld" value="{{m.role}}" onChange="{{m.onRole}}" aria-label="{{m.roleAria}}" style="width: auto; min-height: 38px; padding: 4px 10px; font-size: 13px"><option value="desk">استقبال طلبات</option><option value="design">مصمم</option><option value="prod">إنتاج</option><option value="delivery">تسليم وتحصيل</option><option value="admin">مدير</option></select></sc-if></span>
<span role="cell"><span class="{{m.stCls}}">{{m.stLabel}}</span></span>
<span role="cell" class="muted" style="font-size: 13px">{{m.last}}</span>
<span role="cell"><sc-if value="{{m.editable}}" hint-placeholder-val="{{false}}"><button class="g-btn g-line" type="button" onClick="{{m.toggle}}" style="min-height: 36px; padding: 2px 14px; border-radius: 999px; font-size: 12px">{{m.toggleLabel}}</button></sc-if></span>
</div>
</sc-for>
</div>
</section>

<section class="card anim-up d1" aria-labelledby="va-h" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="va-h" class="h2">شوف اللوحة بعين كل دور</h2><span class="muted" style="font-size: 12px">كل عضو بيشوف بس الأقسام والأزرار اللي دوره يسمح بيها</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{roleViews}}" as="v" hint-placeholder-count="4">
<a class="lift tint" href="{{v.href}}" style="padding: 14px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit">
<span style="display: flex; align-items: center; justify-content: space-between"><span class="tile" aria-hidden="true" style="width: 40px; height: 40px"><svg class="ic" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{v.icon}}"></path></svg></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: var(--accent-ink)"><path d="M12 19l-7-7 7-7M19 12H5"></path></svg></span>
<strong style="font-size: 15px; color: var(--ink-strong)">{{v.label}}</strong>
<span class="muted" style="font-size: 12px">{{v.perms}} · {{v.people}}</span>
</a>
</sc-for>
</div>
</section>

<div style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 16px; align-items: start">
<section class="card anim-up d2" aria-labelledby="rl-h" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 id="rl-h" class="h2">الأدوار والصلاحيات</h2><span class="muted" style="font-size: 12px">المدير عنده كل الصلاحيات دايمًا</span></div>
<div role="table" aria-label="الأدوار والصلاحيات">
<div role="row" class="xrow" style="font-size: 13px; font-weight: 800; color: var(--ink-strong)"><span role="columnheader">الصلاحية</span><sc-for list="{{roles}}" as="r" hint-placeholder-count="5"><span role="columnheader" style="text-align: center">{{r}}</span></sc-for></div>
<sc-for list="{{matrix}}" as="row" hint-placeholder-count="12">
<sc-if value="{{row.group}}" hint-placeholder-val="{{false}}"><div role="row" class="xrow" style="border-bottom: 0; padding-top: 14px"><span role="rowheader" style="font-size: 12px; font-weight: 800; color: var(--accent-ink)">{{row.group}}</span></div></sc-if>
<div role="row" class="xrow"><span role="rowheader" style="font-weight: 600; font-size: 14px">{{row.label}}</span>
<sc-for list="{{row.cells}}" as="c" hint-placeholder-count="5">
<span role="cell" style="text-align: center"><button class="{{c.cls}}" type="button" role="checkbox" aria-checked="{{c.on}}" aria-label="{{c.aria}}" disabled="{{c.locked}}" onClick="{{c.toggle}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg></button></span>
</sc-for>
</div>
</sc-for>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 16px">
<section class="card anim-up d2" aria-labelledby="sec-h" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<h2 id="sec-h" class="h2">الأمان</h2>
<sc-for list="{{security}}" as="x" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--tint); box-shadow: inset 0 0 0 1px var(--tint-bd)">
<span class="tile" aria-hidden="true" style="width: 38px; height: 38px"><svg class="ic" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{x.icon}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><strong style="font-size: 14px; color: var(--ink-strong)">{{x.label}}</strong><span class="muted" style="font-size: 12px">{{x.desc}}</span></span>
<button class="{{x.cls}}" type="button" role="switch" aria-checked="{{x.on}}" aria-label="{{x.label}}" onClick="{{x.toggle}}"></button>
</div>
</sc-for>
</section>
<section class="card anim-up d3" aria-labelledby="ses-h" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<h2 id="ses-h" class="h2">الأجهزة المسجّل منها دخول</h2>
<sc-for list="{{sessions}}" as="d" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px">
<span class="tile" aria-hidden="true" style="width: 38px; height: 38px"><svg class="ic" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{d.icon}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><strong style="font-size: 14px; color: var(--ink-strong)">{{d.name}}</strong><span class="muted" style="font-size: 12px">{{d.when}}</span></span>
<sc-if value="{{d.current}}" hint-placeholder-val="{{false}}"><span class="badge b-ok">الجهاز ده</span></sc-if>
</div>
</sc-for>
<button class="g-btn g-line" type="button" onClick="{{signOutAll}}" style="align-self: flex-start; min-height: 40px; padding: 4px 16px; border-radius: 999px; font-size: 13px">تسجيل خروج من الأجهزة التانية</button>
</section>
</div>
</div>

<section class="card anim-up d3" aria-labelledby="lg-h" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<h2 id="lg-h" class="h2">سجل نشاط الإدارة</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{log}}" as="l" hint-placeholder-count="4">
<li style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 22px"><span aria-hidden="true" style="width: 10px; height: 10px; margin-top: 6px; flex-shrink: 0; border-radius: 999px; background: #7ee8c7; box-shadow: 0 0 0 3px rgba(126,232,199,0.25), 0 0 8px rgba(126,232,199,0.7)"></span><time class="muted" style="flex-shrink: 0; min-width: 150px; font-weight: 600">{{l.t}}</time><span>{{l.m}}</span></li>
</sc-for>
</ol>
</section>
</div>

<sc-if value="{{invite}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px">
<div class="fade" aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px)"></div>
<form class="card pop" role="dialog" aria-modal="true" aria-labelledby="inv-h" onSubmit="{{sendInvite}}" style="position: relative; width: 100%; max-width: 460px; padding: 24px; display: flex; flex-direction: column; gap: 14px; background: var(--sheet-bg)">
<h2 id="inv-h" tabindex="-1" class="h1" style="font-size: 21px">دعوة عضو جديد</h2>
<div style="display: flex; flex-direction: column; gap: 6px"><label class="lbl" for="iv-name">الاسم</label><input class="fld" id="iv-name" type="text" value="{{iv.name}}" onChange="{{onIv.name}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label class="lbl" for="iv-ph">رقم الموبايل أو الإيميل</label><input class="fld" id="iv-ph" type="text" dir="ltr" value="{{iv.contact}}" onChange="{{onIv.contact}}" style="text-align: right"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label class="lbl" for="iv-role">الدور</label><select class="fld" id="iv-role" value="{{iv.role}}" onChange="{{onIv.role}}"><option value="desk">استقبال طلبات</option><option value="design">مصمم</option><option value="prod">إنتاج</option><option value="delivery">تسليم وتحصيل</option><option value="admin">مدير</option></select></div>
<p class="tint" style="margin: 0; padding: 10px 14px; font-size: 13px; line-height: 22px">هيوصله لينك دعوة يفعّل بيه حسابه [مدة صلاحية اللينك بانتظار التأكيد].</p>
<sc-if value="{{ivErr}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin: 0; padding: 8px 12px; border-radius: 12px; background: var(--warn-bg); border: 1px solid var(--warn-bd); font-size: 13px; font-weight: 700">اكتب الاسم ورقم الموبايل أو الإيميل.</p></sc-if>
<div style="display: flex; gap: 10px">
<button class="g-btn g-cta" type="submit" style="flex: 1 1 auto; min-height: 48px; border-radius: 999px">ابعت الدعوة</button>
<button class="g-btn g-soft" type="button" onClick="{{closeInvite}}" style="min-height: 48px; padding: 0 22px; border-radius: 999px">إلغاء</button>
</div>
</form>
</div>
</sc-if>

<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div class="toast pop" role="status">
<span aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 999px; background: linear-gradient(180deg,#b8f2de,#7ee8c7); color: #01302d; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke-width: 2.6"><path d="M20 6 9 17l-5-5"></path></svg></span>
<span style="flex-grow: 1">{{toast}}</span>
<button type="button" onClick="{{hideToast}}" aria-label="إغلاق الإشعار" style="width: 32px; height: 32px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.08); color: #fff; cursor: pointer">×</button>
</div>
</sc-if>
</div>
