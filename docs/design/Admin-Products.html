<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الخدمات والمنتجات — لوحة الإدارة</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="assets/dc-lite.js"></script>
</head>
<body>
<template id="dc-template"><x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{--bg:#f3faf8;--ink:#030909;--ink-strong:#030909;--muted:rgba(3,9,9,.6);--line:rgba(0,92,88,.12);--accent-ink:#005c58;--card-bg:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.6));--card-bd:rgba(255,255,255,.95);--card-sh:0 0 0 1px rgba(0,92,88,.1),inset 0 1px 0 #fff,0 10px 26px rgba(0,92,88,.1);--bar-sh:0 0 0 1px rgba(126,232,199,.5),inset 0 1px 0 #fff,0 0 22px rgba(126,232,199,.2),0 12px 30px rgba(0,92,88,.1);--field-bg:rgba(255,255,255,.85);--field-bd:rgba(0,92,88,.25);--field-ink:#030909;--focus:#005c58;--focus-ring:rgba(126,232,199,.45);--soft-bg:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,255,255,.6));--soft-ink:#005c58;--soft-bd:rgba(0,92,88,.25);--cta-bg:linear-gradient(180deg,rgba(0,120,112,.92),rgba(0,43,40,.92));--chip-off-bg:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.5));--chip-off-ink:#005c58;--chip-off-bd:rgba(0,92,88,.18);--chip-on-bg:linear-gradient(180deg,#00706a,#004541);--chip-on-ink:#fff;--tint:linear-gradient(135deg,rgba(184,242,222,.45),rgba(126,232,199,.16));--tint-bd:rgba(0,92,88,.12);--tile-bg:linear-gradient(135deg,rgba(220,250,240,.9),rgba(184,242,222,.45));--tile-ink:#005c58;--side-bg:#01302d;--side-glow:rgba(0,92,88,.95);--warn-bg:rgba(214,174,98,.22);--warn-ink:#5c430f;--warn-bd:#d6ae62;--ok-bg:linear-gradient(180deg,#00706a,#004541);--ok-ink:#fff;--off-bg:rgba(3,9,9,.08);--off-ink:rgba(3,9,9,.6);--overlay:rgba(0,43,40,.45);--sheet-bg:linear-gradient(180deg,rgba(255,255,255,.98),rgba(243,250,248,.97));--toast-bg:#01302d;--img-bg:#e8f3f0;--opt-bg:#ffffff;--opt-ink:#030909}
</style>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1)}
body{margin:0;background:var(--bg)}
*{box-sizing:border-box}
a{color:var(--accent-ink)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.side :focus-visible{outline-color:#7ee8c7}
.page{position:relative;overflow:clip;isolation:isolate;min-height:100vh;display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px;padding:16px;background:var(--bg);color:var(--ink);font-family:Cairo,'Segoe UI',Tahoma,sans-serif}
.card{background:var(--card-bg);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--card-bd);box-shadow:var(--card-sh);border-radius:26px}
.bar{border-radius:24px;padding:12px 14px 12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;box-shadow:var(--bar-sh)}
.side{position:sticky;top:16px;overflow:hidden;isolation:isolate;flex:1 1 248px;max-width:100%;min-height:calc(100vh - 32px);background:var(--side-bg);color:#fff;border-radius:28px;padding:20px 14px;display:flex;flex-direction:column;gap:22px;border:1px solid rgba(126,232,199,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 26px rgba(126,232,199,.16),0 20px 44px rgba(0,0,0,.25)}
.side-glow{position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse 120% 50% at 70% 0%,var(--side-glow) 0%,rgba(0,0,0,0) 100%)}
.side-l{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;border-radius:16px;font-size:15px;font-weight:700;color:rgba(255,255,255,.8);text-decoration:none;border:1px solid transparent}
.side-l:hover{background:rgba(255,255,255,.07);color:#fff}
.side-l[aria-current="page"]{background:linear-gradient(180deg,rgba(126,232,199,.28),rgba(126,232,199,.1));color:#fff;border-color:rgba(126,232,199,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 18px rgba(126,232,199,.3)}
.main-col{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
.h1{margin:0;font-size:24px;line-height:36px;font-weight:800;color:var(--ink-strong)}
.h2{margin:0;font-size:17px;line-height:28px;font-weight:800;color:var(--ink-strong)}
.muted{color:var(--muted)}
.g-btn{position:relative;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-decoration:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.g-btn[disabled]{opacity:.5;cursor:not-allowed}
.g-cta{background:var(--cta-bg);color:#fff;border:1.5px solid rgba(126,232,199,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 18px rgba(126,232,199,.12),0 0 18px rgba(126,232,199,.42),0 0 40px rgba(126,232,199,.18)}
.g-soft{background:var(--soft-bg);color:var(--soft-ink);border:1px solid var(--soft-bd)}
.chip{min-height:38px;padding:4px 16px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer}
.chip-off{background:var(--chip-off-bg);color:var(--chip-off-ink);border:1px solid var(--chip-off-bd)}
.chip-on{background:var(--chip-on-bg);color:var(--chip-on-ink);border:1px solid rgba(126,232,199,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 14px rgba(126,232,199,.4)}
.fld{width:100%;min-height:46px;padding:8px 14px;border-radius:14px;border:1px solid var(--field-bd);background:var(--field-bg);color:var(--field-ink);font-size:15px}
.fld:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring);outline:none}
.fld option{background:var(--opt-bg);color:var(--opt-ink)}
.lbl{font-size:13px;font-weight:700}
.tint{background:var(--tint);box-shadow:inset 0 0 0 1px var(--tint-bd);border-radius:16px}
.tile{display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--tile-bg);color:var(--tile-ink);box-shadow:0 0 0 1px var(--tint-bd)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.neon-t{color:#7ee8c7;text-shadow:0 0 10px rgba(126,232,199,.55),0 0 26px rgba(126,232,199,.3)}
img[src="assets/7e9c2bf666d78520c5029e5857437282.svg"]{filter:drop-shadow(0 0 4px rgba(126,232,199,.75)) drop-shadow(0 0 12px rgba(126,232,199,.3))}
.sw{position:relative;width:46px;height:26px;flex-shrink:0;border:0;padding:0;border-radius:999px;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .45s var(--ease)}
.sw-on{background:linear-gradient(180deg,#00a08f,#00706a);box-shadow:0 0 12px rgba(126,232,199,.55)}
.sw-on::after{transform:translateX(-20px)}
.sw-off{background:var(--off-bg);box-shadow:inset 0 0 0 1px var(--line)}
.sw[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:11px;line-height:20px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok-ink);box-shadow:0 0 10px rgba(126,232,199,.35)}
.b-warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-bd)}
.b-off{background:var(--off-bg);color:var(--off-ink)}
.b-glass{background:rgba(0,20,18,.6);color:#fff;border:1px solid rgba(126,232,199,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.toast{position:fixed;bottom:24px;left:24px;z-index:40;max-width:440px;display:flex;gap:10px;align-items:center;padding:12px 14px 12px 18px;border-radius:20px;background:var(--toast-bg);color:#fff;font-size:15px;font-weight:600;border:1px solid rgba(126,232,199,.55);box-shadow:0 0 26px rgba(126,232,199,.3),0 16px 34px rgba(0,0,0,.3)}
.g-btn,.chip,.side-l,.sw,.lift{transition:background .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease),transform .5s var(--ease),color .35s var(--ease),opacity .4s var(--ease),filter .5s var(--ease) !important}
.g-btn:hover,.lift:hover{transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{transform:translateX(-104%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.anim-up{animation:fadeUp .8s var(--ease) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.slide{animation:slideIn .6s var(--ease) both}
.drawer{animation:drawerIn .6s var(--ease) both}
.fade{animation:fadeIn .4s var(--ease) both}
.pop{animation:pop .5s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
.pcard{overflow:hidden;display:flex;flex-direction:column}
.pimg{position:relative;height:160px;overflow:hidden;background:var(--img-bg)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--ease),filter .5s var(--ease)}
.pcard:hover .pimg img{transform:scale(1.05)}
.off .pimg img{filter:grayscale(1) opacity(.55)}
.tag{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--tint);box-shadow:inset 0 0 0 1px var(--tint-bd);color:var(--accent-ink)}
.opt{position:relative;display:inline-flex;align-items:center;min-height:36px;padding:4px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt:focus-within{outline:2px solid var(--focus);outline-offset:2px}
</style>
</helmet>
<div class="page">
<img src="assets/09db2274cf741cc3e59da087108d65f1.svg" alt="" aria-hidden="true" style="position: absolute; z-index: -1; top: 320px; left: -240px; width: 680px; height: 680px; pointer-events: none">

<nav class="side slide" aria-label="قائمة الإدارة">
<div class="side-glow" aria-hidden="true"></div>
<img src="assets/7e9c2bf666d78520c5029e5857437282.svg" alt="" aria-hidden="true" style="position: absolute; z-index: -1; bottom: -170px; right: -190px; width: 460px; height: 460px; opacity: .5; pointer-events: none">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 6px">
<img src="assets/a09b143d6b90eabfcff65a45080007f7.jpg" alt="شعار يوزرسيف" style="width: 56px; height: 56px; border-radius: 16px; box-shadow: 0 0 0 1px rgba(126,232,199,0.4), 0 0 18px rgba(126,232,199,0.25)">
<span style="display: flex; flex-direction: column"><strong style="font-size: 17px">لوحة <span class="neon-t">الإدارة</span></strong><span style="font-size: 12px; color: rgba(255,255,255,0.7)">بيئة تجريبية</span></span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
<li><a class="side-l" href="{{n.href}}" aria-current="{{n.cur}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.icon}}"></path></svg><span style="flex-grow: 1">{{n.label}}</span>
<sc-if value="{{n.count}}" hint-placeholder-val="{{false}}"><span style="min-width: 24px; padding: 0 8px; border-radius: 999px; background: #d6ae62; color: #030909; font-size: 12px; font-weight: 800; text-align: center">{{n.count}}</span></sc-if></a></li>
</sc-for>
</ul>
<div style="margin-top: auto; padding: 12px; border-radius: 20px; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(126,232,199,0.3)">
<span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 999px; background: linear-gradient(180deg,#b8f2de,#7ee8c7); color: #01302d; display: flex; align-items: center; justify-content: center; font-weight: 800">ي</span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">صاحب المحل</span><span style="font-size: 12px; color: rgba(255,255,255,0.7)">مدير</span></span>
<a href="{{homeHref}}" style="padding: 6px 10px; border-radius: 12px; color: #b8f2de; font-size: 13px; font-weight: 700; text-decoration: none; border: 1px solid rgba(126,232,199,0.35)">خروج</a>
</div>
</nav>

<div class="main-col">
<header class="card bar anim-up">
<div style="flex-grow: 1; display: flex; flex-direction: column">
<h1 class="h1">الخدمات والمنتجات</h1>
<span class="muted" style="font-size: 13px">اللي بيظهر للعملاء في الموقع وفي منشئ الطلب</span>
</div>
<label style="position: relative; display: flex; align-items: center; flex: 0 1 280px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">بحث في المنتجات</span>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; right: 14px; width: 18px; height: 18px; color: var(--muted)"><path d="M19 11a8 8 0 1 1-16 0 8 8 0 1 1 16 0M21 21l-4.3-4.3"></path></svg>
<input class="fld" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="اسم المنتج" style="border-radius: 999px; padding-right: 42px">
</label>
<button class="g-btn g-cta" type="button" onClick="{{openNew}}" style="min-height: 46px; padding: 8px 22px; border-radius: 999px; font-size: 15px">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg>إضافة منتج</button>
</header>

<section class="anim-up d1" aria-label="ملخص" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
<sc-for list="{{stats}}" as="t" hint-placeholder-count="3">
<div class="card lift" style="padding: 14px 18px; display: flex; align-items: center; gap: 14px; border-radius: 22px">
<span class="tile" aria-hidden="true" style="width: 44px; height: 44px"><svg class="ic" viewBox="0 0 24 24"><path d="{{t.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column"><strong style="font-size: 26px; line-height: 34px; color: var(--ink-strong)">{{t.n}}</strong><span class="muted" style="font-size: 13px; font-weight: 700">{{t.label}}</span></span>
</div>
</sc-for>
</section>

<div class="anim-up d2" role="group" aria-label="تصنيف" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<button class="{{c.cls}}" type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button>
</sc-for>
</div>

<section class="anim-up d3" aria-label="المنتجات" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="8">
<article class="{{p.cls}}">
<div class="pimg">
<img src="{{p.img}}" alt="{{p.name}}">
<span class="badge b-glass" style="position: absolute; top: 10px; right: 10px">{{p.catLabel}}</span>
<span class="{{p.visCls}}" style="position: absolute; top: 10px; left: 10px">{{p.visLabel}}</span>
</div>
<div style="padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<h2 class="h2" style="font-size: 16px; line-height: 26px">{{p.name}}</h2>
<p class="muted" style="margin: 0; font-size: 13px; line-height: 21px">{{p.desc}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px">
<sc-for list="{{p.tags}}" as="g" hint-placeholder-count="3"><span class="tag">{{g}}</span></sc-for>
</div>
</div>
<div style="padding: 10px 16px 14px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line)">
<button class="{{p.swCls}}" type="button" role="switch" aria-checked="{{p.visStr}}" aria-label="{{p.swLabel}}" onClick="{{p.toggle}}"></button>
<span style="flex-grow: 1; font-size: 13px; font-weight: 700">ظاهر في الموقع</span>
<button class="g-btn g-soft" type="button" onClick="{{p.edit}}" style="min-height: 36px; padding: 2px 14px; border-radius: 999px; font-size: 13px">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497zM15 5l4 4"></path></svg>تعديل</button>
</div>
</article>
</sc-for>
</section>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div class="card" style="padding: 36px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px"><strong>مفيش منتجات بالبحث ده</strong><button class="g-btn g-soft" type="button" onClick="{{clear}}" style="min-height: 42px; padding: 4px 18px; border-radius: 999px">امسح البحث</button></div>
</sc-if>
<p class="tint" style="margin: 0; padding: 10px 16px; font-size: 13px; line-height: 22px">الأسعار مش بتظهر للعملاء. كل طلب بيتسعّر بعد المراجعة حسب الكمية والتصميم.</p>
</div>

<sc-if value="{{drawerOpen}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 30; display: flex; justify-content: flex-end">
<button class="fade" type="button" aria-label="إغلاق" onClick="{{closeDrawer}}" style="position: absolute; inset: 0; border: 0; background: var(--overlay); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px)"></button>
<form class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-h" onSubmit="{{save}}" style="position: relative; width: min(460px, 100%); height: 100%; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; background: var(--sheet-bg); color: var(--ink); border-radius: 0 28px 28px 0; box-shadow: 1px 0 0 rgba(126,232,199,0.6), 10px 0 34px rgba(0,0,0,0.25)">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="dr-h" tabindex="-1" class="h1" style="font-size: 21px">{{drawerTitle}}</h2>
<button class="g-btn g-soft" type="button" onClick="{{closeDrawer}}" aria-label="إغلاق" style="width: 40px; height: 40px; border-radius: 999px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.4"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
<label style="position: relative; display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 18px; border: 1.5px dashed var(--field-bd); background: var(--tint); cursor: pointer">
<input type="file" accept="image/*" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<img src="{{draft.img}}" alt="" style="width: 72px; height: 72px; border-radius: 14px; object-fit: cover; background: var(--img-bg)">
<span style="display: flex; flex-direction: column"><strong style="font-size: 14px">صورة المنتج</strong><span class="muted" style="font-size: 12px">اختار صورة جديدة (JPG أو PNG)</span></span>
</label>
<div style="display: flex; flex-direction: column; gap: 6px">
<label class="lbl" for="d-name">اسم المنتج</label>
<input class="fld" id="d-name" type="text" value="{{draft.name}}" onChange="{{onName}}" aria-invalid="{{nameInv}}">
<sc-if value="{{nameErr}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; color: var(--warn-ink)">اكتب اسم المنتج.</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label class="lbl" for="d-cat">التصنيف</label>
<select class="fld" id="d-cat" value="{{draft.cat}}" onChange="{{onCat}}"><option value="wear">ملابس وكابات</option><option value="mug">مجات وهدايا</option><option value="phone">كفرات موبايل</option><option value="sticker">استيكرات ومطبوعات</option><option value="service">خدمات طباعة</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label class="lbl" for="d-desc">وصف قصير</label>
<textarea class="fld" id="d-desc" rows="2" value="{{draft.desc}}" onChange="{{onDesc}}" style="line-height: 24px"></textarea>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend class="lbl" style="padding: 0; margin-bottom: 8px">الألوان المتاحة</legend>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{colorOpts}}" as="o" hint-placeholder-count="3"><label class="{{o.cls}}"><input type="checkbox" checked="{{o.on}}" onChange="{{o.toggle}}">{{o.label}}</label></sc-for></div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
