name: Cron

# Vercel Hobby runs crons at most daily (vercel.json keeps a daily backstop). This workflow calls
# the frequent ones. GitHub may delay scheduled runs by several minutes. On Vercel Pro, move these
# schedules back into vercel.json and delete this file (ADR-0004).
on:
  schedule:
    - cron: "*/5 * * * *" # messages:dispatch
    - cron: "15 * * * *" # otp:cleanup
  workflow_dispatch:

concurrency:
  group: cron-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_URL: ${{ secrets.CRON_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call cron routes
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_APP_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          call() {
            out=$(curl --fail-with-body -sS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$1") || {
              echo "::error::$1 failed: $out"
              return 1
            }
            echo "::notice::$1 $out"
          }
          case "${{ github.event.schedule }}" in
            "15 * * * *") call otp-cleanup ;;
            *) call messages-dispatch ;;
          esac
